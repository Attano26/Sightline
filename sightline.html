const closeTour = () => { const o = $("#onb"); o.hidden = true; o.innerHTML = ""; };

function openTour(startAt) {
  let i = startAt || 0;
  const go = n => { i = n; paint(); };
  const finish = () => { S.tourDone = true; save(); closeTour(); renderRail(); renderStream(); };

  function paint() {
    const step = TOUR[i];
    const o = $("#onb");
    o.hidden = false; o.innerHTML = "";
    const wrap = el("div", "onbwrap"); o.appendChild(wrap);

    const top = el("div", "onbtop");
    const brand = el("div", "onbbrand");
    brand.appendChild(appLogo());
    brand.appendChild(el("span", "", "Sightline"));
    top.appendChild(brand);
    const skip = el("button", "onbskip", "Skip");
    skip.onclick = finish;
    top.appendChild(skip);
    wrap.appendChild(top);

    const art = el("div", "onbart");
    art.appendChild(onbArt(step.art));
    wrap.appendChild(art);

    const foot = el("div", "onbfoot");
    const h = el("h2", "onbttl");
    step.title.forEach((seg, n) => {
      const sp = el("span", seg[1] ? "dim" : "");
      sp.textContent = (n ? " " : "") + seg[0];
      h.appendChild(sp);
    });
    foot.appendChild(h);
    foot.appendChild(el("p", "onbbody", step.body));

    if (step.kind === "name") stepName(foot);
    if (step.kind === "signin") stepSignIn(foot);
    if (step.kind === "key") stepKey(foot);
    if (step.kind === "context") stepContext(foot);

    const dots = el("div", "onbdots");
    TOUR.forEach((_, n) => {
      const d = el("button", "onbdot" + (n === i ? " on" : ""));
      d.title = TOUR[n].tag;
      d.onclick = () => go(n);
      dots.appendChild(d);
    });
    foot.appendChild(dots);

    const act = el("div", "onbact");
    if (i > 0) { const b = el("button", "onbbtn ghost", "Back"); b.onclick = () => go(i - 1); act.appendChild(b); }
    const last = i === TOUR.length - 1;
    const nx = el("button", "onbbtn" + (last ? " dark" : ""), last ? "Start using it" : "Continue");
    nx.onclick = last ? finish : () => go(i + 1);
    act.appendChild(nx);
    foot.appendChild(act);

    wrap.appendChild(foot);
  }

  function stepName(foot) {
    const f = el("div", "onbfld");
    const inp = el("input");
    inp.placeholder = "Your first name is plenty";
    inp.value = S.userName || "";
    inp.oninput = () => { S.userName = inp.value.slice(0, 40); save(); };
    inp.onkeydown = e => { if (e.key === "Enter" && i < TOUR.length - 1) go(i + 1); };
    f.appendChild(inp);
    foot.appendChild(f);
    setTimeout(() => inp.focus(), 120);
  }

  function stepSignIn(foot) {
    const f = el("div", "onbfld");
    const g = gsync();
    const canSync = location.protocol === "https:" || location.hostname === "localhost";

    if (!canSync || !clientId()) {
      f.appendChild(el("div", "hint", !canSync
        ? "Google will not accept a sign in from a file opened directly, or from a preview pane. Open the hosted version and this appears."
        : "Sign in is not set up for this copy of the app. Everything else works, and your data stays on this device."));
      foot.appendChild(f); return;
    }

    const st = el("div", "hint");
    const b = el("button", "onbbtn g" + (g.token ? "" : " dark"));
    b.appendChild(googleMark());
    const lbl = el("span", "", g.token ? "Signed in" : "Continue with Google");
    b.appendChild(lbl);
    b.disabled = !!g.token;
    if (g.token) st.textContent = "Signed in. Your work is being kept in your Drive.";
    else st.innerHTML = "It asks for one permission: to manage the single file it creates. It cannot see anything else in your Drive.";
    b.onclick = async () => {
      b.disabled = true; lbl.textContent = "Waiting for Google…";
      try {
        await gSignIn(true);
        const r = await gSync();
        // A returning person's data comes back right here, which is the whole
        // reason sign in sits before the two screens that ask them to type.
        if (r.did === "pulled") { st.textContent = "Signed in, and your existing work came back."; renderRail(); renderStream(); }
        else if (r.did === "conflict") st.textContent = "Signed in. There are two versions of your data, so Settings will ask which to keep.";
        else st.textContent = "Signed in. Everything from here on is kept in your Drive.";
        setSyncBadge("ok");
        lbl.textContent = "Signed in";
      } catch (e) {
        const msg = e.message || "Unknown error";
        st.innerHTML = esc(msg) + signInHelp(msg);
        b.disabled = false; lbl.textContent = "Try again";
      }
    };
    f.appendChild(b); f.appendChild(st);
    foot.appendChild(f);
  }

  function stepKey(foot) {
    const f = el("div", "onbfld");
    const inp = el("input");
    inp.type = "password";
    inp.placeholder = "Paste a Gemini key, or skip";
    inp.value = S.key || "";
    const st = el("div", "hint");
    const say = () => {
      st.innerHTML = S.key
        ? "Saved on this device. Settings can test it against Google whenever you want."
        : "Free from <b>aistudio.google.com</b>. Stored in this browser only, sent to Google and nobody else, and deliberately left out of the Drive sync.";
    };
    inp.oninput = () => { S.key = inp.value.trim(); save(); say(); };
    say();
    f.appendChild(inp); f.appendChild(st);
    foot.appendChild(f);
  }

  function stepContext(foot) {
    const ws = activeWs();
    const missing = ctxMissing(ws);
    const f = el("div", "onbfld");
    const b = el("button", "onbbtn", missing.length ? "Set up my workspace" : "Review my workspace");
    b.onclick = () => { S.tourDone = true; save(); closeTour(); renderRail(); renderStream(); openWorkspace(ws.id); };
    f.appendChild(b);
    f.appendChild(el("div", "hint", missing.length
      ? "Still blank: " + esc(missing.join(", ")).toLowerCase() + ". It starts filled in for Schüco India as a worked example, so change it to yours."
      : "Filled in for Schüco India as a worked example. Change it to yours, or start a fresh workspace from the sidebar."));
    foot.appendChild(f);
  }

  paint();
}

      mv.appendChild(el("div", "hint", "There is only one workspace. Create another and this simulation can be moved into it."));

      mv.appendChild(el("div", "hint", "The simulation keeps everything it already said. What changes is the context it uses if you ask a follow up, because that comes from the workspace it lives in."));
      const row = el("div", "clopts");
      others.forEach(w => {
        const b = el("button", "clopt", w.name);

          c.wsId = w.id; c.updated = Date.now();
          S.activeWs = w.id; S.activeChat = c.id;
          save(); renderRail(); renderStream(); closeSheet();
          toast("Moved to " + w.name);
        };
        row.appendChild(b);
      });
      mv.appendChild(row);
    }
    s.appendChild(mv);

    const del = el("button", "btn danger", "Delete this simulation");
    del.onclick = () => {

      if (S.activeChat === c.id) S.activeChat = null;
      save(); renderRail(); renderStream(); closeSheet(); toast("Deleted");
    };
    s.appendChild(del);

      };

function applyProfile(ws, id, md) {
  let p = null;
  try { p = parseProfile(md); } catch (e) { p = null; }
  const filled = p ? Object.keys(p.ctx).length : 0;
  if (!p || (!filled && !p.facts.length)) {
    toast("That file did not contain a profile Sightline could read");
    return;
  }
  Object.keys(p.ctx).forEach(k => { if (p.ctx[k]) ws.ctx[k] = p.ctx[k]; });
  if (p.facts.length) {
    ws.facts = ws.facts || [];
    p.facts.forEach(t => { if (!ws.facts.some(f => f.text === t)) ws.facts.push({ text:t, at:Date.now() }); });
  }
  if (Object.keys(p.behaviour).length) {
    ws.behaviour = Object.assign({}, ws.behaviour || {}, p.behaviour);
    ws.behaviourSource = "";
  }
  if (p.uncertain.length) ws.pendingCheck = p.uncertain;
  save(); renderRail(); renderStream(); openWorkspace(id);
  toast("Imported " + filled + " fields, " + p.facts.length + " facts, " +
        Object.keys(p.behaviour).length + " behaviour answers");
}

/* ============================================================
   GOOGLE DRIVE SYNC

   The data lives in the user's own Drive, in a private folder
   that only this app can see. There is no server here and there
   never will be. Google handles who you are, Drive handles where
   things go, and nothing passes through anything of mine.

   Two deliberate exclusions from what gets synced:
     the Gemini key, because an API key does not belong in a file
     that travels, even a private one, and
     the access token, which is short lived and device specific.

   Conflicts are resolved by asking. Silently overwriting a day of
   someone's work to avoid a dialogue is not a trade worth making.
   ============================================================ */
/* The OAuth client this app ships with.

   A client ID is not a secret. It is designed to be public and to sit in the
   page. That is the whole reason the console work belongs to whoever publishes
   the app, once, and not to every person who opens it. Asking each user to
   create their own OAuth client was the wrong shape: it is developer setup, and
   it was being handed to the wrong person.

   Anyone self hosting on a different origin can still set their own in Settings,
   which is why the override below survives. */
/* Bumped with the service worker on every deploy, and shown in Settings, About.
   It is the only way to tell a bug in the new version from an old version still
   sitting in a cache. */
const BUILD = "2026-08-26-g";

const APP_CLIENT_ID = "338257030150-3tinoqpdmraqero5svhvk38dab1tqn81.apps.googleusercontent.com";

/* Shipped first, and the stored one only as a fallback.

   That order also repairs a device by loading it. The console displays a client
   ID shortened, and a shortened one produces exactly the 401 invalid_client this
   app was returning for days. Since the built-in value now wins, any truncated
   string already saved on a device is simply never read again. */
const clientId = () => (APP_CLIENT_ID || (gsync().clientId || "")).trim();

/* drive.file, not drive.appdata.

   Both keep this app out of the rest of someone's Drive. The difference is what
   Google asks of the publisher: drive.appdata is a sensitive scope, so shipping
   it to the public needs a verification review, and until that clears only
   hand-added test users can sign in. drive.file is not sensitive, so the consent
   screen can be published and anyone can sign in straight away.

   The cost is that the file is visible in the person's Drive rather than hidden,
   which they could delete. Being visible is arguably the more honest of the two
   anyway, and it is a fair price for a sign-in that works for everyone. */
const GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const GDRIVE_FILE = "sightline-data.json";
let gisReady = false, tokenClient = null;

function gsync() { return (S.gsync = S.gsync || { clientId:"", auto:true, fileId:"", lastSync:0, lastPulledAt:0 }); }

/* What travels. Everything about your work, nothing about your credentials. */
function syncPayload() {
  return {
    v: 1,
    updatedAt: S.updatedAt || 0,
    theme: S.theme || "",
    mode: S.mode,
    workspaces: S.workspaces,
    chats: S.chats,
    signals: S.signals
  };
}
function applyPayload(p) {
  if (!p || !Array.isArray(p.workspaces) || !p.workspaces.length) return false;
  S.workspaces = p.workspaces;
  S.chats = Array.isArray(p.chats) ? p.chats : [];
  S.signals = Array.isArray(p.signals) ? p.signals : [];
  if (p.mode) S.mode = p.mode;
  S.updatedAt = p.updatedAt || 0;
  if (!S.workspaces.some(w => w.id === S.activeWs)) S.activeWs = S.workspaces[0].id;
  if (!S.chats.some(c => c.id === S.activeChat)) S.activeChat = null;
  repairText(S);
  return true;
}

function loadGIS() {
  if (gisReady) return Promise.resolve(true);
  if (location.protocol !== "https:" && location.hostname !== "localhost") return Promise.resolve(false);
  return new Promise(res => {
    const sc = document.createElement("script");
    sc.src = "https://accounts.google.com/gsi/client";
    sc.async = true; sc.defer = true;
    sc.onload = () => { gisReady = true; res(true); };
    sc.onerror = () => res(false);
    document.head.appendChild(sc);
    setTimeout(() => res(gisReady), 8000);
  });
}

function gToken() {
  const g = gsync();
  return (g.token && g.tokenExp && Date.now() < g.tokenExp - 60000) ? g.token : null;
}

async function gSignIn(interactive) {
  const g = gsync();
  if (!clientId()) throw new Error("No sign in is configured for this copy of the app.");
  const ok = await loadGIS();
  if (!ok || !window.google || !google.accounts) throw new Error("Could not reach Google sign in. Check your connection, or an extension may be blocking it.");
  return new Promise((res, rej) => {
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId(),
        scope: GDRIVE_SCOPE,
        callback: r => {
          if (r && r.access_token) {
            g.token = r.access_token;
            g.tokenExp = Date.now() + ((r.expires_in || 3600) * 1000);
            save(); res(g.token);
          } else rej(new Error("Google did not return access."));
        },
        error_callback: e => {
          const t = (e && e.type) || "";
          if (t === "popup_closed") return rej(new Error("Sign in was closed before it finished."));
          if (t === "popup_failed_to_open") return rej(new Error("The sign in window was blocked. Allow popups for this site and try again."));
          rej(new Error("Google refused the sign in. If its page said 401 invalid_client, the OAuth client is almost certainly not of type Web application, or you pasted the client secret instead of the client ID. The setup notes above cover both."));
        }
      });
      tokenClient.requestAccessToken({ prompt: interactive ? "consent" : "" });
    } catch (e) { rej(e); }
  });
}

async function gFetch(url, opts) {
  const t = gToken() || await gSignIn(false);
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({ Authorization: "Bearer " + t }, o.headers || {});
  const r = await fetch(url, o);
  if (r.status === 401) { gsync().token = ""; throw new Error("Google signed you out. Sign in again."); }
  if (!r.ok) {
    let m = "";
    try { const j = await r.json(); m = (j.error && j.error.message) || ""; } catch (e) {}
    throw new Error(m || ("Drive returned " + r.status));
  }
  return r;
}

async function gFindFile() {
  const g = gsync();
  // Under drive.file this listing can only ever return files this app created,
  // so there is no folder to scope it to and nothing of theirs to sift through.
  const q = encodeURIComponent("name = '" + GDRIVE_FILE + "' and trashed = false");
  const r = await gFetch("https://www.googleapis.com/drive/v3/files?q=" + q +
    "&fields=files(id,name,modifiedTime)&pageSize=20&orderBy=modifiedTime desc");
  const j = await r.json();
  const f = (j.files || [])[0] || null;
  g.fileId = f ? f.id : "";
  return f;
}

async function gPush() {
  const g = gsync();
  if (!g.fileId) {
    await gFindFile();
    if (!g.fileId) {
      const r = await gFetch("https://www.googleapis.com/drive/v3/files", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ name: GDRIVE_FILE, mimeType:"application/json" })
      });
      g.fileId = (await r.json()).id;
    }
  }
  const body = JSON.stringify(syncPayload());
  await gFetch("https://www.googleapis.com/upload/drive/v3/files/" + g.fileId + "?uploadType=media", {
    method:"PATCH", headers:{ "Content-Type":"application/json" }, body
  });
  g.lastSync = Date.now(); g.lastPulledAt = S.updatedAt || 0;
  save(); return body.length;
}

async function gPull() {
  const g = gsync();
  const f = await gFindFile();
  if (!f) return null;
  const r = await gFetch("https://www.googleapis.com/drive/v3/files/" + g.fileId + "?alt=media");
  const txt = await r.text();
  try { return JSON.parse(txt); } catch (e) { throw new Error("The file in Drive could not be read."); }
}

/* Decide what to do, and ask when the answer is genuinely ambiguous. */
async function gSync(opts) {
  const g = gsync();
  const remote = await gPull();
  const localAt = S.updatedAt || 0;
  const remoteAt = remote ? (remote.updatedAt || 0) : -1;

  if (!remote) { const n = await gPush(); return { did:"pushed", bytes:n, reason:"nothing was in Drive yet" }; }
  if (remoteAt === localAt) { g.lastSync = Date.now(); save(); return { did:"same", reason:"both copies already match" }; }

  const localChangedSincePull = localAt > (g.lastPulledAt || 0);
  if (remoteAt > localAt && !localChangedSincePull) {
    applyPayload(remote); g.lastSync = Date.now(); g.lastPulledAt = S.updatedAt || 0; save();
    return { did:"pulled", reason:"Drive was newer and nothing here had changed" };
  }
  if (localAt > remoteAt && !(remote && remoteAt > (g.lastPulledAt || 0))) {
    const n = await gPush(); return { did:"pushed", bytes:n, reason:"this device was newer" };
  }
  if (opts && opts.resolve === "mine") { const n = await gPush(); return { did:"pushed", bytes:n, reason:"you chose this device" }; }
  if (opts && opts.resolve === "theirs") {
    applyPayload(remote); g.lastSync = Date.now(); g.lastPulledAt = S.updatedAt || 0; save();
    return { did:"pulled", reason:"you chose the Drive copy" };
  }
  return { did:"conflict", localAt, remoteAt,
           localCounts:{ w:S.workspaces.length, c:S.chats.length },
           remoteCounts:{ w:(remote.workspaces||[]).length, c:(remote.chats||[]).length } };
}

/* ============================================================
   SETTINGS

   One screen per subject, reached from a short list. The previous
   version put a key field, a five step Google setup, export tools
   and two disclaimers on a single scroll, and the setup notes alone
   were longer than everything else combined. Nobody reads that, so
   nobody found the parts that mattered.

   Each page owns one decision and says only what that decision
   needs.
   ============================================================ */
const SETTINGS_PAGES = [
  { id:"you",   name:"You",              note:"Your name, theme, and what a new simulation starts as" },
  { id:"key",   name:"AI key",           note:"Needed to run live. Without it you stay in demo mode" },

];

function settingsRowStatus(id) {

  if (id === "sync") return g.token ? "On" : (clientId() ? "Not signed in" : "Unavailable");

/* ---------- AI key ---------- */
function pageKey(s) {
  const n = el("div", "notice");
  n.innerHTML = S.key
    ? "<span>A key is set, so simulations run live. Everything is generated from your context rather than replayed.</span>"
    : "<span><b>You are in demo mode.</b> Prepared examples, fully explorable, nothing generated. Add a key and every answer becomes real.</span>";
  s.appendChild(n);

  const f = el("div", "fld");
  f.appendChild(el("label", "", "Google Gemini API key"));
  const i = el("input"); i.type = "password"; i.value = S.key || ""; i.placeholder = "Paste your key";
  i.oninput = () => { S.key = i.value.trim(); save(); };
  f.appendChild(i);
  f.appendChild(el("div", "hint", "Stored in this browser only. Sent to Google and nowhere else, because this app has no server. Get one free at aistudio.google.com."));
  s.appendChild(f);

  const diag = el("div");
  const row = el("div", "btnrow");
  const tb = el("button", "btn pri", "Test this key");
  const report = (ok, title, body, raw) => {
    diag.innerHTML = "";
    const b = el("div", ok ? "notice" : "err");
    if (ok) b.style.borderColor = "var(--accent)";
    b.innerHTML = "<span><b>" + esc(title) + "</b> " + body + "</span>";
    diag.appendChild(b);
    if (raw) {
      const d = el("details", "gaps"); d.style.borderTop = "none";
      d.appendChild(el("summary", "", "What Google actually said"));
      const p = el("div", "gap");
      p.style.fontFamily = "var(--fs-mono)"; p.style.fontSize = "11.5px"; p.style.wordBreak = "break-word";
      p.textContent = raw;
      d.appendChild(p); diag.appendChild(d);
    }
  };
  tb.onclick = async () => {
    if (!S.key) { report(false, "No key entered.", "Paste one above first."); return; }
    tb.textContent = "Testing…"; tb.disabled = true; diag.innerHTML = "";
    const probe = m => callGeminiOnce(S.key, "Reply with JSON.", "Say ok.",
      { type:"object", properties:{ ok:{ type:"string" } }, required:["ok"] }, m);
    try {
      await probe("key"); S.authMode = "key"; save();
      report(true, "It works.", "Authenticated as an API key. You are running live.");
    } catch (e1) {
      if (e1.status === 429) {
        S.authMode = "key"; save();
        report(true, "Valid, but rate limited.", "Google is throttling this project, usually a free tier quota. Wait a minute and try a simulation.", e1.message);
      } else if (e1.reason === "API_KEY_INVALID") {
        try {
          await probe("bearer"); S.authMode = "bearer"; save();
          report(true, "That is an OAuth token, not an API key.", "It works, and Sightline has switched to bearer authentication. Note these expire, often within the hour. An AI Studio key does not.");
        } catch (e2) {
          report(false, "Google rejected this both ways.",
            "It is not a valid API key and not a valid OAuth token. Usually it was copied incompletely, it was revoked, or it is restricted in Google Cloud Console to an Android app or specific sites, which a browser can never satisfy. A fresh unrestricted key from <b>aistudio.google.com</b> is the quickest fix.", e2.message);
        }
      } else if (e1.status === 403) {
        report(false, "Real key, not allowed here.", "Either the Generative Language API is not enabled on its project, or the key carries an application restriction a browser cannot meet.", e1.message);
      } else if (e1.status === 404) {
        report(false, "The key is fine, the model is not reachable.", "This project cannot see <b>" + MODEL + "</b>, usually because billing is not active on it.", e1.message);
      } else if (/Failed to fetch|NetworkError/i.test(e1.message || "")) {
        report(false, "Could not reach Google.", "A network problem rather than a key problem. The key was never tested.", e1.message);
      } else {
        report(false, "That did not work.", esc(e1.message || "Unknown error"), e1.message);
      }
    }
    tb.disabled = false; tb.textContent = "Test this key";
  };
  row.appendChild(tb);
  if (S.key) {
    const rm = el("button", "btn danger", "Remove key");
    rm.onclick = () => { S.key = ""; save(); openSettingsPage("key"); toast("Key removed. Back to demo mode."); };
    row.appendChild(rm);
  }
  s.appendChild(row);
  s.appendChild(diag);

  const c = el("div", "notice");
  c.innerHTML = "<span><b>What it costs.</b> Nothing like what you might expect. This app never uses web search, which is where the expense normally sits, so a simulation is a few thousand tokens. A fraction of a rupee, and free on Google's free tier.</span>";
  s.appendChild(c);
}

/* ---------- Sync ---------- */
function pageSync(s) {
  const g = gsync();
  const canSync = location.protocol === "https:" || location.hostname === "localhost";

  if (!canSync) {
    const n = el("div", "notice");
    n.innerHTML = "<span><b>Not available here.</b> Google refuses sign in from a file opened directly, or from a preview. Open the hosted version and this page becomes available.</span>";
    s.appendChild(n);
    return;
  }

  const n = el("div", "notice");
  n.innerHTML = g.token
    ? "<span><b>Sync is on.</b> Last synced " + esc(g.lastSync ? new Date(g.lastSync).toLocaleString() : "never") + "."
      + " Your work sits in your own Drive as a single file named <b>" + esc(GDRIVE_FILE) + "</b>.</span>"
    : "<span>Your work follows you between devices, stored in <b>your own Google Drive</b> as a single file this app creates. It can read and write that one file and nothing else of yours. There is no server in this, and nothing passes through anyone else.</span>";
  s.appendChild(n);

  // Nothing to configure when the app ships its own client, which is the normal
  // case. The console walkthrough only appears for somebody self hosting on
  // their own origin, who has to bring their own.
  if (!APP_CLIENT_ID) selfHostSetup(s, g);

  const out = el("div");
  const row = el("div", "btnrow");
  const bIn = el("button", "btn pri", g.token ? "Sync now" : "Continue with Google");
  bIn.onclick = async () => {
    if (!clientId()) { out.innerHTML = ""; const e2 = el("div", "err"); e2.innerHTML = "<b>Sign in is not configured for this copy.</b> The setup notes above cover it."; out.appendChild(e2); return; }
    bIn.textContent = "Working…"; bIn.disabled = true; out.innerHTML = "";
    try {
      if (!gToken()) await gSignIn(true);
      const r = await gSync();
      if (r.did === "conflict") { renderConflict(out, r); }
      else {
        const ok = el("div", "notice"); ok.style.borderColor = "var(--accent)";
        const w = { pushed:"Sent to Drive", pulled:"Brought down from Drive", same:"Already in sync" };
        ok.innerHTML = "<span><b>" + (w[r.did] || "Done") + ".</b> " + esc(r.reason) + ".</span>";
        out.appendChild(ok);
        if (r.did === "pulled") { renderRail(); renderStream(); }
        setSyncBadge("ok");
      }
    } catch (e) {
      const msg = e.message || "Unknown error";
      const e2 = el("div", "err");
      e2.innerHTML = "<b>That did not work.</b> " + esc(msg) + signInHelp(msg);
      out.appendChild(e2); setSyncBadge("error");
    }
    bIn.textContent = gToken() ? "Sync now" : "Continue with Google"; bIn.disabled = false;
  };
  row.appendChild(bIn);
  syncTail(s, g, row, out);
}

function selfHostSetup(s, g) {
  const setup = el("details", "gaps"); setup.style.borderTop = "none";
  const sm = el("summary");
  sm.appendChild(el("span", "tw", "›"));
  sm.appendChild(el("span", "", g.clientId ? "Change the Google setup" : "Bring your own Google client"));
  setup.appendChild(sm);
  const steps = el("div", "gaplist");
  const st = el("div", "confbox");
  st.innerHTML =
    "<b>Once, in your own Google account.</b><ol>" +
    "<li>At <b>console.cloud.google.com</b>, pick the project your Gemini key lives in.</li>" +
    "<li><b>APIs and Services</b>, then <b>Library</b>. Search <b>Google Drive API</b>, press Enable.</li>" +
    "<li><b>OAuth consent screen</b>. External, name it, add your own email as a test user. Leave it in Testing, which allows a hundred people and needs no review.</li>" +
    "<li><b>Credentials</b>, <b>Create credentials</b>, <b>OAuth client ID</b>, type <b>Web application</b>.</li>" +
    "<li>Under <b>Authorised JavaScript origins</b> add exactly <b>" + esc(location.origin) + "</b>, no trailing slash.</li>" +
    "<li>Press the <b>copy button</b> beside the Client ID. Do not select the text, because the console shows it shortened.</li>" +
    "</ol>" +
    "<b>If Google says 401 invalid_client</b>, in order of likelihood: the client is not type <b>Web application</b> and cannot be changed after creation, or you pasted the client secret, or it is in a different project, or it was created minutes ago and has not propagated yet.";
  steps.appendChild(st);
  setup.appendChild(steps);
  s.appendChild(setup);

  const f = el("div", "fld");
  f.appendChild(el("label", "", "Client ID"));
  const ci = el("input");
  ci.placeholder = "Ends in .apps.googleusercontent.com";
  ci.value = g.clientId || "";
  // Live feedback, not help text. It has to look like it is reacting, or it reads
  // as a fixed paragraph that happens to mention a number.
  const ciWarn = el("div", "cistatus");
  const checkCi = () => {
    const v = (g.clientId || "").trim();
    ciWarn.className = "cistatus";
    if (!v) { ciWarn.innerHTML = ""; return; }
    const SUF = ".apps.googleusercontent.com";
    const set = (state, msg) => {
      ciWarn.className = "cistatus " + state;
      ciWarn.innerHTML = '<span class="cidot"></span><span class="citext">' + msg +
        '</span><span class="cicount">' + v.length + '</span>';
    };
    if (/…|\.\.\./.test(v)) return set("bad", "That is the shortened version the console displays. Use the copy button beside it.");
    if (/\s/.test(v)) return set("bad", "There is a space or line break in it. Copy it again.");
    if (/^GOCSPX/i.test(v)) return set("bad", "That is the client <b>secret</b>. You want the one ending in " + SUF);
    if (!v.endsWith(SUF)) return set("wait", "Keep going. It should end in " + SUF);
    const head = v.slice(0, v.length - SUF.length);
    // Real IDs are a project number, a dash, then a random section that may itself
    // contain hyphens and underscores. An earlier pattern excluded hyphens and
    // wrongly rejected valid IDs.
    if (!/^\d{6,}-[A-Za-z0-9_-]{6,}$/.test(head)) return set("bad", "The part before " + SUF + " does not look like a project number followed by a random section.");
    set("ok", "Looks complete. Project number <b>" + esc(head.split("-")[0]) + "</b>.");
  };
  ci.oninput = () => { g.clientId = ci.value.trim(); save(); checkCi(); };
  f.appendChild(ci); f.appendChild(ciWarn); checkCi();
  s.appendChild(f);
}

/* Both copies moved since the last sync, so there is no correct answer to pick
   silently. Show what each side actually holds and let them choose. */
function renderConflict(out, r) {
  const c = el("div", "err");
  c.innerHTML = "<b>Both copies changed since the last sync.</b> This device holds " + r.localCounts.w +
    " workspaces and " + r.localCounts.c + " simulations, last changed " + esc(new Date(r.localAt).toLocaleString()) +
    ". Drive holds " + r.remoteCounts.w + " and " + r.remoteCounts.c + ", last changed " +
    esc(new Date(r.remoteAt).toLocaleString()) + ". Export first if you are unsure.";
  const fx = el("div", "fix");
  const mine = el("button", "", "Keep this device");
  mine.onclick = async () => { await gSync({ resolve:"mine" }); openSettingsPage("sync"); toast("Drive now matches this device"); };
  const theirs = el("button", "", "Take the Drive copy");
  theirs.onclick = async () => { await gSync({ resolve:"theirs" }); renderRail(); renderStream(); openSettingsPage("sync"); toast("This device now matches Drive"); };
  fx.appendChild(mine); fx.appendChild(theirs); c.appendChild(fx);
  out.appendChild(c);
}

/* Google returns these as bare codes, which tell the person nothing. Each one has
   exactly one cause worth naming, and naming it is the difference between a fix
   and a dead end. */
function signInHelp(msg) {
  const m = String(msg || "").toLowerCase();
  // Established by experiment against Google's authorize endpoint, changing only
  // the client ID: invalid_client is about the ID string and nothing else, and a
  // wrong origin returns redirect_uri_mismatch instead. Worth being exact,
  // because these two send you to opposite ends of the console.
  if (m.indexOf("invalid_client") > -1 || m.indexOf("client was not found") > -1)
    return " Google could not find the client this app identified itself with, which almost always " +
           "means the ID it sent is incomplete. The console displays it shortened, and a shortened " +
           "one produces exactly this. That is the publisher's to fix, not yours.";
  if (m.indexOf("redirect_uri_mismatch") > -1 || m.indexOf("origin_mismatch") > -1)
    return " This app is not registered for <b>" + esc(location.origin) +
           "</b>. It works from the address it was published at. That is the publisher's to fix, not yours.";
  // access_denied covers two completely different things, and telling somebody
  // they declined when Google actually blocked them sends them looking in the
  // wrong place entirely. The verification wording only ever appears for the
  // second one, so it is worth splitting on.
  // "access blocked", not bare "blocked", which a blocked popup also contains.
  if (m.indexOf("verification") > -1 || m.indexOf("has not completed") > -1 || m.indexOf("access blocked") > -1)
    return " Google blocked it rather than you declining. This app's consent screen is still set to " +
           "<b>Testing</b>, which only lets accounts on its tester list in. The fix belongs to whoever " +
           "publishes the app: publish the consent screen, or add this address as a tester.";
  if (m.indexOf("access_denied") > -1 || m.indexOf("denied") > -1)
    return " Either you closed the Google window, or the consent screen is still in Testing and this " +
           "address is not on its tester list. Nothing was changed either way.";
  if (m.indexOf("popup") > -1)
    return " Your browser blocked the Google window. Allow popups for this site and press it again.";
  return "";
}

/* The sign out control and the sync timing option, shared by both routes into
   this page so they cannot drift apart. */
function syncTail(s, g, row, out) {
  if (g.token) {
    const bOut = el("button", "btn", "Sign out");
    bOut.onclick = () => { g.token = ""; g.tokenExp = 0; save(); openSettingsPage("sync"); toast("Signed out here. Nothing was deleted from Drive."); };
    row.appendChild(bOut);
  }
  s.appendChild(row);
  s.appendChild(out);

  const au = el("div", "fld");
  au.appendChild(el("label", "", "When to sync"));
  const arow = el("div", "clopts");
  [[true, "Automatically"], [false, "Only when I press it"]].forEach(([v, lb]) => {
    const b = el("button", "clopt" + (!!g.auto === v ? " on" : ""), lb);
    b.onclick = () => { g.auto = v; save(); openSettingsPage("sync"); };
    arow.appendChild(b);
  });
  au.appendChild(arow);
  au.appendChild(el("div", "hint", "Your Gemini key is deliberately left out of the sync. An API key does not belong in a file that travels between devices, even a private one."));
  s.appendChild(au);
}

/* ---------- Your data ---------- */
function pageData(s) {
  const n = el("div", "notice");
  const g = S.gsync || {};
  n.innerHTML = "<span><b>" + stateSizeKb() + " KB stored</b>, roughly " + S.chats.length +
    (S.chats.length === 1 ? " simulation" : " simulations") + " across " + S.workspaces.length +
    (S.workspaces.length === 1 ? " workspace" : " workspaces") + ". A browser allows about 5,000 KB, so there is a very long way to go." +
    (g.token ? " It is also copied to your Drive." : " It lives only in this browser, so clearing site data would delete it.") + "</span>";
  s.appendChild(n);

  const f = el("div", "fld");
  f.appendChild(el("label", "", "Take a copy"));
  const row = el("div", "btnrow");
  const ex = el("button", "btn pri", "Export everything");
  ex.onclick = async () => {
    const json = JSON.stringify(S, null, 2);
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) { await dl.save({ filename:"sightline-backup.json", data:json }); return; }
    } catch (e) {}
    try {
      const blob = new Blob([json], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sightline-backup.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) {
      navigator.clipboard.writeText(json).then(() => toast("Download blocked, so it is on your clipboard instead"));
    }
  };
  row.appendChild(ex);
  const im = el("button", "btn", "Import a backup");
  im.onclick = () => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
    inp.onchange = () => {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const o = JSON.parse(fr.result); if (!o.workspaces) throw 0;
          if (!confirm("Replace everything on this device with the backup? Export first if you are unsure.")) return;
          S = o; repairText(S); save(); renderRail(); renderStream(); openSettingsPage("data"); toast("Imported");
        } catch (e) { toast("That file could not be read"); }
      };
      fr.readAsText(inp.files[0]);
    };
    inp.click();
  };
  row.appendChild(im);
  f.appendChild(row);
  f.appendChild(el("div", "hint", "One file with everything: workspaces, facts, simulations and signals. Keep one, whether or not you use Drive."));
  s.appendChild(f);

  const d = el("div", "fld");
  d.appendChild(el("label", "", "Start again"));
  const del = el("button", "btn danger", "Delete everything on this device");
  del.onclick = () => {
    if (!confirm("Delete every workspace, simulation and fact on this device? Export first. This cannot be undone.")) return;
    if (!confirm("Really delete all of it?")) return;
    localStorage.removeItem(K); S = fresh(); save();
    renderRail(); renderStream(); closeSheet(); toast("Everything deleted");
  };
  d.appendChild(del);
  d.appendChild(el("div", "hint", (S.gsync && S.gsync.token)
    ? "This clears the copy on this device. The copy in your Drive is untouched, and signing in again would bring it back."
    : "There is no other copy unless you exported one."));
  s.appendChild(d);
}

/* ---------- About ---------- */
/* Which build is running, and what this device thinks its own screen is.

   Both exist because a layout bug on a phone I cannot open a console on was
   being debugged by guessing. A screenshot of this is evidence; a description of
   a symptom is not. The build stamp settles the other recurring question, which
   is whether the version being described is the version that was just shipped. */
function pageDiag(s) {
  const vv = window.visualViewport;
  const cs = getComputedStyle(document.documentElement);
  const rows = [
    ["Build", BUILD],
    ["Window", window.innerWidth + " by " + window.innerHeight],
    ["Visible viewport", vv ? Math.round(vv.width) + " by " + Math.round(vv.height) : "not reported"],
    ["Applied height", cs.getPropertyValue("--apph").trim() || "falling back to dvh"],
    ["Measured bottom gap", cs.getPropertyValue("--safeb").trim() || "0px"],
    ["Safe area, reported", getComputedStyle(document.body).getPropertyValue("padding-bottom") || "n/a"],
    ["Pixel ratio", String(window.devicePixelRatio || 1)],
    ["Standalone", (matchMedia("(display-mode: standalone)").matches ? "yes" : "no")],
    ["Composer bottom", (() => {
      const t = document.querySelector("#ta");
      if (!t) return "n/a";
      const b = t.getBoundingClientRect().bottom;
      const lim = vv ? vv.height : window.innerHeight;
      return Math.round(b) + " of " + Math.round(lim) + (b > lim + 1 ? "  OFF SCREEN" : "  visible");
    })()]
  ];
  const w = el("div", "fld");
  w.appendChild(el("label", "", "This device"));
  const box = el("div", "confbox");
  box.innerHTML = "<ul>" + rows.map(r =>
    "<li><b>" + esc(r[0]) + ":</b> " + esc(String(r[1])) + "</li>").join("") + "</ul>";
  w.appendChild(box);
  const cp = el("button", "btn", "Copy this");
  cp.onclick = () => {
    const txt = rows.map(r => r[0] + ": " + r[1]).join("\n");
    navigator.clipboard.writeText(txt).then(() => toast("Copied. Paste it to whoever is fixing it."),
      () => toast("Could not copy here"));
  };
  w.appendChild(cp);
  s.appendChild(w);
}

function openSignals() {
  openSheet("Signals to watch", s => {
    const open = S.signals.filter(x => x.state === "open");
    if (!open.length) {
      const n = el("div", "notice");
      n.innerHTML = "<span>No signals tracked yet. Every risk in a card carries an early warning you can watch for. Tap <b>Track signals</b> on any card to bring them here, grouped under the simulation they came from.</span>";
      s.appendChild(n); return;
    }
    const n = el("div", "notice");
    n.innerHTML = "<span>These are dated, checkable predictions, each kept with the question that produced it. Marking what actually happened is the only way this tool ever learns whether it was right, and every answer is added to that workspace as a confirmed fact.</span>";
    s.appendChild(n);

    // Grouped by simulation. A flat list of warnings with no question attached
    // is unreadable after the second one.
    // Newest simulation first, but stages within a simulation stay in order.
    const groups = [];
    open.forEach(sig => {
      const key = sig.chatId || ("mode:" + sig.mode);
      let g = groups.find(x => x.key === key);
      if (!g) { g = { key, title: sig.chatTitle || modeById(sig.mode).name,
                      question: sig.question || "", mode: sig.mode,
                      wsName: sig.wsName || "", items: [] }; groups.push(g); }
      g.items.push(sig);
    });

    groups.reverse().forEach(g => {
      const box = el("div", "siggroup");
      const hd = el("div", "sighd");
      hd.appendChild(el("span", "sigmode", modeById(g.mode).name));
      if (g.wsName) hd.appendChild(el("span", "sigws", g.wsName));
      hd.appendChild(el("span", "sigcount", g.items.length + (g.items.length === 1 ? " signal" : " signals")));
      box.appendChild(hd);
      box.appendChild(el("div", "sigq", g.question ? QL + words(g.question, 22) + QR : g.title));

      g.items.forEach(sig => {
        const row = el("div", "sigitem" + (sig.severity === "HIGH" ? " high" : ""));
        const meta = el("div", "sigmeta");
        meta.appendChild(el("span", "sigstage", sig.stage || ""));
        meta.appendChild(el("span", "sigwhen", HZ[sig.horizon] || "soon"));
        row.appendChild(meta);
        row.appendChild(el("div", "sigtext", sig.text));
        if (sig.risk) row.appendChild(el("div", "sigrisk", "Would mean: " + sig.risk));
        const btns = el("div", "sigbtns");
        [["It happened", "hit"], ["It did not", "miss"], ["Too early", "open"]].forEach(([lb, st]) => {
          const bb = el("button", "sigbtn" + (st === "hit" ? " hit" : st === "miss" ? " miss" : ""), lb);
          bb.onclick = () => {
            if (st === "open") { toast("Left open"); return; }
            sig.state = st;
            const w = S.workspaces.find(x => x.id === sig.wsId);
            if (w) {
              w.facts = w.facts || [];
              const txt = (st === "hit" ? "Observed: " : "Did not happen: ") + sig.text +
                          ". Predicted when asking " + QL + words(sig.question || sig.headline, 16) + QR + ".";
              if (!w.facts.some(f => f.text === txt)) w.facts.push({ text:txt, at:Date.now() });
            }
            save(); renderSignalCount(); openSignals();
          };
          btns.appendChild(bb);
        });
        row.appendChild(btns);
        box.appendChild(row);
      });
      s.appendChild(box);
    });

    const done = S.signals.filter(x => x.state !== "open");
    if (done.length) {
      const d = el("details", "gaps"); d.style.borderTop = "1px solid var(--line-2)";
      const sm = el("summary");
      sm.appendChild(el("span", "tw", "›"));
      sm.appendChild(el("span", "", "Already resolved"));
      sm.appendChild(el("span", "cnt", String(done.length)));
      d.appendChild(sm);
      const gl = el("div", "gaplist");
      done.slice().reverse().forEach(x => {
        const g2 = el("div", "gap");
        g2.appendChild(el("div", "gu", x.text));
        g2.appendChild(el("div", "gh", x.state === "hit" ? "It happened" : "It did not happen"));
        gl.appendChild(g2);
      });
      d.appendChild(gl); s.appendChild(d);
    }
  });
}

/* ---------- the clarify panel ----------
   One question per screen, like a short interview. Answering three questions
   on one screen reads as a form and gets skipped; answering one at a time
   reads as a conversation and gets finished. Back, next, and skip are always
   available so it never traps anyone.
   --------------------------------------- */
let clarifyState = null;

/* The refusal for input with nothing in it.

   Deliberately has no way past it. Every other gate in this app offers one,
   because every other gate is guessing about something the person may know
   better. This one is not guessing: there is no decision in the text, so there
   is nothing a simulation could be right or wrong about. Offering "run it
   anyway" here would only produce a confident answer to a question nobody
   asked, which is precisely what it exists to prevent. */
function openNothing(text, why) {
  closeClarify();
  const c = $("#clarify"); c.hidden = false; c.innerHTML = "";
  c.classList.add("cannot");
  setFocus(true, () => { closeCannot(); $("#ta").focus(); });
  const head = el("div", "clhead");
  head.appendChild(el("span", "cantttl", "There is no decision in that yet"));
  c.appendChild(head);
  c.appendChild(el("div", "cantwhy", why));
  c.appendChild(el("div", "cantwhy2", "Describe the move you are weighing up and it has something to react to. It does not need to be long, but it does need to contain the thing you are thinking of doing."));

  const lb = el("div", "cantlb", "Questions like these do work");
  c.appendChild(lb);
  const exs = el("div", "clopts");
  reframeExamples(S.mode).forEach(q => {
    const b = el("button", "clopt", q);
    b.onclick = () => { $("#ta").value = q; autosize(); updateSend(); closeCannot(); $("#ta").focus(); };
    exs.appendChild(b);
  });
  c.appendChild(exs);

  const opts = el("div", "clopts");
  const ed = el("button", "clopt", "Let me write one");
  ed.onclick = () => { closeCannot(); $("#ta").focus(); };
  opts.appendChild(ed);
  c.appendChild(opts);
  scrollDown();
}

function openCannot(text, why) {
  closeClarify();
  const c = $("#clarify"); c.hidden = false; c.innerHTML = "";
  c.classList.add("cannot");
  setFocus(true, () => { closeCannot(); $("#ta").focus(); });
  const head = el("div", "clhead");
  head.appendChild(el("span", "cantttl", "This is not a question Sightline can answer"));
  c.appendChild(head);
  c.appendChild(el("div", "cantwhy", why));
  c.appendChild(el("div", "cantwhy2", "It has no web search, by design. That is what keeps it free to run, and it is why it reasons about what people will do rather than reporting what is currently true."));

  const lb = el("div", "cantlb", "Questions like these do work");
  c.appendChild(lb);
  const exs = el("div", "clopts");
  reframeExamples(S.mode).forEach(q => {
    const b = el("button", "clopt", q);
    b.onclick = () => { $("#ta").value = q; autosize(); updateSend(); closeCannot(); $("#ta").focus(); };
    exs.appendChild(b);
  });
  c.appendChild(exs);

  const opts = el("div", "clopts");
  const ed = el("button", "clopt", "Let me rewrite mine");
  ed.onclick = () => { closeCannot(); $("#ta").focus(); };
  opts.appendChild(ed);
  const any = el("button", "clopt", "Ask it anyway");
  any.onclick = () => { S.overrideAnswerability = true; closeCannot(); submit(); };
  opts.appendChild(any);
  c.appendChild(opts);

  const warn = el("div", "cantalt");
  warn.appendChild(el("span", "lb", "If you ask anyway"));
  warn.appendChild(el("span", "", "It will answer from training data with no way to check it, and the confidence score will not know that the answer was unanswerable. Treat anything factual in it as unverified."));
  c.appendChild(warn);

}
function closeCannot() {
  const c = $("#clarify"); c.hidden = true; c.innerHTML = ""; c.classList.remove("cannot");
  setFocus(false);
}

function setFocus(on, onDismiss) {
  const f = $("#focusScrim");
  if (!f) return;
  f.hidden = !on;
  // Clicking away closes the question but keeps what was typed, so nothing the
  // user wrote is lost by a stray tap.
  f.onclick = on ? (onDismiss || null) : null;
}

function closeClarify() {
  clarifyState = null;
  const c = $("#clarify"); c.hidden = true; c.innerHTML = ""; c.classList.remove("cannot");
  setFocus(false);
}

function openClarify(text, mode, gaps, askMode) {
  clarifyState = { base: text, mode, gaps, idx: 0, picked: {}, custom: {}, askMode: !!askMode };
  $("#clarify").hidden = false;
  setFocus(true, () => { const t = clarifyState ? clarifyState.base : ""; closeClarify(); $("#ta").value = t; autosize(); updateSend(); });
  paintClarify();

}

function clarifySteps() {
  const st = clarifyState;
  const steps = st.gaps.map(g => ({ kind: "slot", g }));
  if (st.askMode) steps.unshift({ kind: "mode" });
  return steps;
}

function paintClarify() {
  const st = clarifyState; if (!st) return;
  const ws = activeWs();
  const c = $("#clarify"); c.innerHTML = "";
  const steps = clarifySteps();
  const step = steps[st.idx];
  const total = steps.length;

  const head = el("div", "clhead");
  head.appendChild(el("span", "clstep", "Question " + (st.idx + 1) + " of " + total));
  const skip = el("button", "clskip", "Skip and run anyway");
  skip.onclick = () => { const t = st.base, m = st.mode; closeClarify(); doRun(t, m); };
  head.appendChild(skip);
  c.appendChild(head);

  const blk = el("div", "clq");
  const row = el("div", "clopts");
  let noteBox = null, paintNote = null;

  if (step.kind === "mode") {
    blk.appendChild(el("div", "clqt", "What are you testing?"));
    MODES.forEach(m => {
      const b = el("button", "clopt" + (st.mode === m.id ? " on" : ""), m.name);
      b.onclick = () => { st.mode = m.id; st.gaps = findGaps(st.base, m.id, ws); next(); };
      row.appendChild(b);
    });
  } else {
    const g = step.g;
    const qh = el("div", "clqt");
    qh.appendChild(el("span", "", g.slot.q));
    if (g.slot.multi) qh.appendChild(el("span", "clmulti", "pick any number"));
    if (g.id === "rival") qh.appendChild(el("span", "clsrc", "from your saved list"));
    blk.appendChild(qh);

    let opts = [];
    try { opts = g.slot.options(ws, st.base) || []; } catch (e) { opts = []; }
    const cur = () => st.picked[g.id] || (st.picked[g.id] = []);

    opts.forEach(o => {
      const isCustom = o.label === "Someone else";
      const b = el("button", "clopt", o.label);
      // A title attribute is a desktop affordance and does not exist on a phone,
      // which is where most of this gets answered, so the note also renders.
      if (o.note) b.title = o.note;
      if (cur().some(x => x.label === o.label)) b.classList.add("on");
      b.onclick = () => {
        const list = cur();
        const i = list.findIndex(x => x.label === o.label);
        if (i >= 0) {
          list.splice(i, 1); b.classList.remove("on");
          if (isCustom) { const f = c.querySelector(".clfree"); if (f) f.remove(); }
        } else {
          // exclusive options clear everything, and any other option clears them
          if (!g.slot.multi || o.excl) { list.length = 0; row.querySelectorAll(".clopt").forEach(x => x.classList.remove("on")); const f = c.querySelector(".clfree"); if (f) f.remove(); }
          else { opts.filter(x => x.excl).forEach(x => {
                   const j = list.findIndex(y => y.label === x.label);
                   if (j >= 0) { list.splice(j, 1); [...row.children].forEach(el2 => { if (el2.textContent === x.label) el2.classList.remove("on"); }); }
                 }); }
          list.push(o); b.classList.add("on");
          if (g.id === "rival" && !isCustom && o.label !== "Not one in particular") {
            const ws2 = activeWs();
            ws2.rivalUse = ws2.rivalUse || {};
            ws2.rivalUse[o.label] = (ws2.rivalUse[o.label] || 0) + 1;
            save();
          }
          if (isCustom) showFree(g);
        }
        if (paintNote) paintNote();
        paintFoot();
      };
      row.appendChild(b);
    });

    // Explain whichever option is selected, in place, rather than relying on a
    // hover that half the users cannot perform.
    if (opts.some(o => o.note)) {
      noteBox = el("div", "clnote");
      paintNote = () => {
        const picked = (st.picked[g.id] || []).map(x => x.label);
        const shown = opts.filter(o => o.note && picked.includes(o.label));
        noteBox.innerHTML = shown.length
          ? shown.map(o => "<b>" + esc(o.label) + ".</b> " + esc(o.note)).join("<br>")
          : "";
      };
    }
  }
  blk.appendChild(row);
  if (noteBox) { blk.appendChild(noteBox); paintNote(); }
  c.appendChild(blk);

  const foot = el("div", "clfoot"); foot.id = "clFoot";
  c.appendChild(foot);
  paintFoot();

  function showFree(g) {
    if (c.querySelector(".clfree")) return;
    const f = el("div", "clfree");
    const inp = el("input");
    inp.placeholder = "Type the name";
    inp.oninput = () => { st.custom[g.id] = inp.value.trim(); paintFoot(); };
    if (st.custom[g.id]) inp.value = st.custom[g.id];
    f.appendChild(inp);
    blk.appendChild(f);
    inp.focus();
  }

  function next() {
    if (st.idx < clarifySteps().length - 1) { st.idx++; paintClarify(); }
    else { const t = buildClarified(), m = st.mode; closeClarify(); doRun(t, m); }
  }

  function paintFoot() {
    const f = $("#clFoot"); if (!f) return;
    f.innerHTML = "";
    if (st.idx > 0) {
      const back = el("button", "clback", "Back");
      back.onclick = () => { st.idx--; paintClarify(); };
      f.appendChild(back);
    }
    const n = Object.keys(st.picked).reduce((a, k) => a + (st.picked[k] || []).length, 0);
    const prev = el("div", "clprev", n ? n + (n === 1 ? " detail added" : " details added") : "Nothing selected yet");
    if (n) prev.classList.add("has");
    f.appendChild(prev);
    const last = st.idx >= clarifySteps().length - 1;
    const go = el("button", "clgo", last ? "Run simulation" : "Next");
    go.onclick = next;
    f.appendChild(go);
    const ta = $("#ta"); ta.value = buildClarified(); autosize();
  }
}

function buildClarified() {
  const st = clarifyState; if (!st) return "";
  const extra = [];
  Object.keys(st.picked).forEach(k => {
    (st.picked[k] || []).forEach(o => {
      if (o.label === "Someone else") {
        const v = (st.custom[k] || "").trim();
        if (v) extra.push(k === "rival" ? "Competitor in focus: " + v + "." : v + ".");
      } else if (o.phrase) extra.push(o.phrase);
    });
  });
  return extra.length ? st.base.replace(/\s*$/, "") + "\n\n" + extra.join(" ") : st.base;
}

/* Every send goes through here. If the question is missing something the
   chosen mode needs, ask before spending a call on a vague answer. Once
   asked for a given question we do not ask again, so a user who skips is
   never nagged. */
function submit() {
  const v = $("#ta").value.trim();
  if (!v || busy) return;
  if (clarifyState) { const t = buildClarified(), m = clarifyState.mode; closeClarify(); doRun(t, m); return; }
  // A referential message about the card already on screen is a conversation,
  // not a new simulation. It skips the clarify and answerability gates, because
  // neither applies to "why do you say that".
  const chat = activeChat();
  if (looksLikeFollowUp(v, chat)) { $("#ta").value = ""; autosize(); updateSend(); runFollowUp(v, chat); return; }
  // Substance is checked first and cannot be overridden. Everything downstream,
  // clarify included, assumes there is a decision in here somewhere to sharpen.
  const empty = noSubstance(v);
  if (empty) { openNothing(v, empty); return; }
  // Answerability is checked next, because running a call on a question that
  // cannot be answered produces a fluent, confident, invented reply.
  if (!S.overrideAnswerability) {
    const why = answerability(v);
    if (why) { openCannot(v, why); return; }
  }
  S.overrideAnswerability = false;
  const guessed = S.forcedMode || inferMode(v);
  const mode = guessed || S.mode;
  const gaps = findGaps(v, mode, activeWs());
  // Ask what kind of question this is only when we genuinely could not tell.
  if (!guessed || gaps.length) { openClarify(v, mode, gaps, !guessed); return; }
  doRun(v, mode);
}

async function runFollowUp(text, chat) {
  if (busy) return;
  const ws = activeWs();
  const last = [...chat.turns].reverse().find(t => t.role === "card");
  if (!last) return;
  chat.turns.push({ role:"user", text, mode:last.mode, followUp:true });
  chat.updated = Date.now(); save();

  const box = $("#streamIn");
  const uw = el("div", "uturn"); const ub = el("div", "ubub");
  ub.appendChild(el("span", "", text));
  uw.appendChild(ub); box.appendChild(uw);

  const host = el("div"); box.appendChild(host);
  const pend = el("div", "replybox pending");
  pend.appendChild(el("span", "dot"));
  pend.appendChild(el("span", "", "Thinking about that"));
  host.appendChild(pend);
  busy = true; updateSend(); scrollDown();

  let out = null, err = null;
  try {
    if (!S.key) { await sleep(600); out = demoFollowUp(text); }
    else out = await callGemini(S.key, followUpPrompt(last.data, last.mode, ws), text, FOLLOWUP_SCHEMA);
  } catch (e) { err = e; }
  busy = false; updateSend();
  pend.remove();

  if (err) {
    const e2 = el("div", "err");
    e2.innerHTML = "<b>That did not go through.</b> " + esc(err.message || "");
    host.appendChild(e2);
    chat.turns.push({ role:"error", title:"That did not go through.", body:" " + (err.message || "") });
  } else {
    chat.turns.push({ role:"reply", data:out });
    renderReply(host, out);
  }
  chat.updated = Date.now(); save(); renderRail(); scrollDown();
}

function renderReply(host, out) {
  const BASIS = { FROM_THE_CARD:["card","From the answer above"],
                  FROM_YOUR_CONTEXT:["ctx","From what you told it"],
                  MY_GENERAL_KNOWLEDGE:["gen","Its own general knowledge, nothing to check it against"],
                  I_DO_NOT_KNOW:["none","It does not know"] };
  const b = BASIS[out.basis] || BASIS.MY_GENERAL_KNOWLEDGE;
  const box = el("div", "replybox fadein");
  box.appendChild(el("div", "replytxt", out.answer));
  const foot = el("div", "replyfoot");
  foot.appendChild(el("span", "rbasis " + b[0], b[1]));
  if (out.changes_the_read && !/^no change/i.test(out.changes_the_read.trim())) {
    const c = el("span", "rchange", "Changes the read: " + out.changes_the_read);
    foot.appendChild(c);
  }
  box.appendChild(foot);
  host.appendChild(box);
}

function doRun(text, mode) {
  $("#ta").value = ""; autosize(); updateSend();
  run(text, mode);
}

/* ------------------------------------------------------------
   UPDATES

   There is one copy of this app, on the host. Change it and every
   installed copy sees the change. The only wrinkle is that an
   installed copy keeps a local version so it opens offline, so it
   has to be told when a newer one exists.

   It is never swapped silently. The new version downloads in the
   background, a bar appears, and the swap happens when the person
   taps it. Nobody should have the interface change under them
   halfway through reading an answer.
   ------------------------------------------------------------ */
function showUpdateBar(reg) {
  const bar = $("#updateBar");
  if (!bar || !bar.hidden) return;
  bar.hidden = false; bar.innerHTML = "";
  const t = el("div", "ubtxt");
  t.innerHTML = "<b>A new version is ready.</b> Your workspaces, facts and history are untouched by this.";
  bar.appendChild(t);
  const row = el("div", "ubrow");
  const go = el("button", "ubbtn", "Reload now");
  go.onclick = () => {
    if (reg.waiting) reg.waiting.postMessage("applyUpdate");
    setTimeout(() => location.reload(), 120);
  };
  row.appendChild(go);
  const later = el("button", "ubbtn ghost", "Not now");
  later.onclick = () => { bar.hidden = true; };
  row.appendChild(later);
  bar.appendChild(row);
}

function watchForUpdates() {
  // A file opened straight from disk, and a sandboxed preview, cannot register a
  // worker. That is expected, not an error, so it fails quietly.
  if (!("serviceWorker" in navigator) || location.protocol === "file:" || location.protocol === "data:") return;
  navigator.serviceWorker.register("./sw.js").then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg);
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        // controller present means this is a replacement, not a first install.
        if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdateBar(reg);
      });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) reg.update().catch(() => {});
    });
  }).catch(() => {});

  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded) return; reloaded = true; location.reload();
  });
}

/* Zoom.

   The viewport meta stops pinch and double tap zoom on a phone. Desktop browsers
   ignore that meta entirely, so the accidental case there, a two finger pinch on
   a trackpad, which the browser sends as a wheel event with ctrl held, is caught
   here instead.

   What is deliberately NOT blocked is keyboard zoom. Ctrl plus and ctrl minus are
   how someone with poor eyesight reads a screen, and taking that away to stop an
   accident is the wrong trade. Accidental zoom goes, intentional zoom stays. */
/* The runtime half of the height fix.

   Only engages when the visual viewport genuinely disagrees with what the
   document laid out against, so on a browser where dvh already behaves this does
   nothing at all. Runs again on resize and on the first few frames after launch,
   which is the window in which the chrome retracts. */
/* Keep the app the size of what is actually on screen.

   The previous version of this only acted when it caught the viewport
   disagreeing with the document by more than two pixels, and on a first launch
   that check simply never fired, so the composer stayed half under the edge of
   the screen until the app was killed and reopened.

   This one does not test for disagreement. visualViewport is the authority on
   what is visible, so its height is written straight out and rewritten whenever
   it changes. That also makes the on screen keyboard behave: the app shrinks to
   the space above it and the composer rides up rather than being covered.

   The rAF pass exists because a first launch settles over several frames and
   fires no event that any listener here would catch. It runs for two seconds
   and stops as soon as the number holds still. */
let vpLast = 0;
function applyViewport() {
  const vv = window.visualViewport;
  const h = Math.round(vv ? vv.height : window.innerHeight);
  if (!h) return false;
  // Always write it. An earlier version returned early when the measurement
  // matched what it last saw, which meant a wrong height applied from anywhere
  // else was never corrected: the tracker had cached the very state it exists to
  // fix. The return value still reports whether the number moved, because the
  // settle loop below needs that to know when to stop, but it no longer decides
  // whether anything gets applied.
  document.documentElement.style.setProperty("--apph", h + "px");
  // env(safe-area-inset-bottom) can read zero on the first paint, which on a
  // gesture navigation phone is what puts the composer under the system bar.
  // The gap between the window and the visible viewport is the same distance,
  // measured rather than declared.
  const gap = Math.max(0, Math.round(window.innerHeight - h));
  document.documentElement.style.setProperty("--safeb", (gap > 2 ? gap : 0) + "px");
  const moved = h !== vpLast;
  vpLast = h;
  return moved;
}

function trackViewport() {
  applyViewport();
  const vv = window.visualViewport;
  if (vv) {
    vv.addEventListener("resize", applyViewport);
    vv.addEventListener("scroll", applyViewport);
  }
  window.addEventListener("resize", applyViewport);
  window.addEventListener("orientationchange", () => setTimeout(applyViewport, 260));
  // Coming back from the background is the other moment the numbers move.
  window.addEventListener("pageshow", applyViewport);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) applyViewport(); });

  const t0 = performance.now();
  let steady = 0;
  const settle = () => {
    const changed = applyViewport();
    steady = changed ? 0 : steady + 1;
    if (steady < 12 && performance.now() - t0 < 2000) requestAnimationFrame(settle);
  };
  requestAnimationFrame(settle);
}

function lockZoom() {
  const stop = e => { if (e.ctrlKey) e.preventDefault(); };
  window.addEventListener("wheel", stop, { passive:false });
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("gesturechange", e => e.preventDefault());
}

const openRail = () => { $("#rail").classList.add("open"); $("#backdrop").classList.add("on"); };
const closeRail = () => { $("#rail").classList.remove("open"); $("#backdrop").classList.remove("on"); };

function boot() {
  load();
  if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  probeStorage(); showStorageBanner(); watchForUpdates(); lockZoom(); trackViewport();
  if (!S.tourDone && !S.chats.length) setTimeout(() => openTour(0), 400);
  syncMode(); renderRail(); renderStream(); updateSend();

  $("#ta").addEventListener("input", () => { autosize(); updateSend(); });
  $("#ta").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });
  $("#send").onclick = () => submit();
  $("#newChat").onclick = () => { S.activeChat = null; save(); renderRail(); renderStream(); closeRail(); $("#ta").focus(); };
  $("#btnNewWs").onclick = () => {
    const w = { id:uid(), name:"New workspace", collapsed:false,
      ctx:{ company:"", product:"", market:"", audience:"", anchor:"", rivals:"", channel:"", customers:"", suppliers:"", bodies:"", horizon:"2 quarters" }, facts:[] };
    S.workspaces.push(w); S.activeWs = w.id; S.activeChat = null;
    save(); renderRail(); renderStream(); openWorkspace(w.id);
  };
  $("#btnSettings").onclick = openSettings;
  $("#btnTour").onclick = () => openTour(0);
  $("#btnSync").onclick = openSettings;
  if (S.gsync && clientId() && S.gsync.token) setSyncBadge("ok");
  $("#btnSignals").onclick = openSignals;
  $("#ctxPill").onclick = () => openWorkspace(activeWs().id);
  $("#typeRow").onclick = () => openModes(id => {
    S.forcedMode = id; S.mode = id; save();
    $("#typeVal").textContent = modeById(id).name;
    $("#typeRow").hidden = false;
  });
  $("#ta").addEventListener("input", () => { S.forcedMode = null; });
  $("#hamb").onclick = openRail;
  $("#backdrop").onclick = closeRail;
  $("#scrim").onclick = e => { if (e.target === $("#scrim")) closeSheet(); };
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("#clarify").hidden) {
      const t = clarifyState ? clarifyState.base : $("#ta").value;
      closeClarify(); closeCannot();
      if (t) { $("#ta").value = t; autosize(); updateSend(); }
      return;
    }
    closeSheet(); closeRail();
  });
  $("#btnTheme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    S.theme = next; save();
  };
}
boot();
</script>

    audience:{ type:"string", description:"Who specifies, who buys, who converts, who sets the rules. One or two sentences." },
    rivals:{ type:"array", maxItems:14, items:{ type:"string", description:"A real competing system house or brand" } },
    channel:{ type:"array", maxItems:6, items:{ type:"string", description:"A real channel type or named partner" } },
    customers:{ type:"array", maxItems:10, items:{ type:"string", description:"A real developer or contractor that buys at scale" } },
    suppliers:{ type:"array", maxItems:8, items:{ type:"string", description:"A real aluminium, glass or hardware supplier" } },
    bodies:{ type:"array", maxItems:6, items:{ type:"string", description:"A real standards or certification body" } },
    uncertain:{ type:"array", maxItems:4, items:{ type:"string", description:"Something you are not confident about and the user should check. Max 12 words." } }
  },
  required:["company","product","market","audience","rivals","channel","customers","suppliers","bodies","uncertain"],
  propertyOrdering:["company","product","market","audience","rivals","channel","customers","suppliers","bodies","uncertain"]
};

function buildSchema(mode) {
  const m = modeById(mode);
  const sh = shapeOf(mode);
  return {
    type:"object",
    properties:{
      call:{ type:"string", enum:["HOLDS","HOLDS_WITH_CHANGES","BREAKS","MALFORMED_PREMISE"] },
      headline:{ type:"string", description:"The answer as a claim with a verb. MAX 12 WORDS. No colon." },
      only_true_here:{ type:"string", description:"The part of this read that would be FALSE for a different company in this same market. MAX 14 WORDS." },
      flips_if:{ type:"string", description:"The most plausible way this whole read is wrong. MAX 16 WORDS." },
      behaviour_used:{ type:"string", description:"Name the ONE local buying practice from the pack that most shaped this read, and say how it changed the answer. If the pack described none, write exactly: none given. MAX 18 WORDS." },
      next_questions:{ type:"array", minItems:3, maxItems:3, items:{ type:"object", properties:{
        q:{ type:"string", description:"A question worth simulating next. MAX 14 WORDS." },
        lane:{ type:"string", enum:["TEST_THE_WEAK_LINK","CHANGE_ONE_VARIABLE","WIDEN_THE_CAST"] }
      }, required:["q","lane"], propertyOrdering:["q","lane"] } },
      actors:{ type:"array", minItems:3, maxItems:4, items:{ type:"object", properties:{
        name:{ type:"string", description:"MAX 5 WORDS" },
        kind:{ type:"string", enum:["RIVAL","CHANNEL","SPECIFIER","BUYER","REGULATOR","SUPPLIER","INTERNAL"] },
        basis:{ type:"string", enum:["USER_NAMED","ROSTER","ARCHETYPE"] },
        wants:{ type:"string", description:"MAX 10 WORDS" },
        lever:{ type:"string", description:"What they can actually do to you. MAX 10 WORDS" }
      }, required:["name","kind","basis","wants","lever"], propertyOrdering:["name","kind","basis","wants","lever"] } },
      rounds:{ type:"array", minItems:3, maxItems:3, items:{ type:"object", properties:{
        round:{ type:"integer" },
        horizon:{ type:"string", enum:HORIZONS },
        actor:{ type:"string", description:"MAX 5 WORDS. Must match an actor name." },
        triggered_by:{ type:"string", description:"The specific thing in the PREVIOUS stage that caused this. Empty for the first stage. Write it as a plain cause, never as a step number. MAX 12 WORDS." },
        move:{ type:"string", description:"What this actor does. MAX 18 WORDS." },
        net_effect:{ type:"string", description:"The consequence for us, written so it reads naturally after the words \"For you:\". MAX 14 WORDS." },
        risk:{ type:"object", properties:{
          text:{ type:"string", description:"The risk this round creates. MAX 14 WORDS." },
          severity:{ type:"string", enum:["MEDIUM","HIGH"] },
          signal:{ type:"string", description:"The observable early warning. MAX 12 WORDS." }
        }, required:["text","severity","signal"], propertyOrdering:["text","severity","signal"] }
      }, required:["round","horizon","actor","triggered_by","move","net_effect","risk"],
         propertyOrdering:["round","horizon","actor","triggered_by","move","net_effect","risk"] } },
      mechanism_new_in_r3:{ type:"string", description:"The mechanism at work by the final stage that did not exist at the first. MAX 14 WORDS." },
      mode_block: sh.schema,
      numbers_used:{ type:"array", maxItems:6, items:{ type:"object", properties:{
        value:{ type:"string", description:"The quantity as written" },
        applies_to:{ type:"string", description:"What this figure is a price of, or a quantity of. MAX 8 WORDS." },
        source:{ type:"string", enum:["USER_PROVIDED","RELATIVE_TO_ANCHOR","MY_ESTIMATE"] }
      }, required:["value","applies_to","source"], propertyOrdering:["value","applies_to","source"] } },
      evidence_gaps:{ type:"array", minItems:1, maxItems:3, items:{ type:"object", properties:{
        unknown:{ type:"string", description:"MAX 10 WORDS" },
        why:{ type:"string", description:"Why it changes the read. MAX 12 WORDS" },
        how:{ type:"string", enum:["ASK_A_FABRICATOR","ASK_AN_ARCHITECT","CHECK_A_TENDER","CHECK_PUBLISHED_DATA","ASK_SALES","INTERNAL_RECORD"] }
      }, required:["unknown","why","how"], propertyOrdering:["unknown","why","how"] } }
    },
    required:["call","headline","only_true_here","flips_if","behaviour_used","next_questions","actors","rounds","mechanism_new_in_r3","mode_block","numbers_used","evidence_gaps"],
    // Ordering is also truncation order. The follow-up chips sit high on purpose:
    // they are the retention mechanism and must never be the thing that gets cut.
    propertyOrdering:["call","headline","only_true_here","flips_if","behaviour_used","next_questions","actors","rounds","mechanism_new_in_r3","mode_block","numbers_used","evidence_gaps"]
  };
}

/* ============================================================
   VALIDATORS — content checks, not box-filled checks
   ============================================================ */
const STOP = new Set("the a an and or but of to in on at for with from by is are be as it its their our your we they this that if then than so not no more most less least will would can could may might have has had do does did about into over under after before".split(" "));
/* Compare stems, not exact words. "fabricator" and "fabricators" are the same
   idea, and treating them as different made the cascade check reject links that
   were genuinely there. */
const stem = w => w.replace(/(ies)$/, "y").replace(/(sses|shes|ches|xes)$/, m => m.slice(0, -2)).replace(/([^s])s$/, "$1");
const toks = s => String(s || "").toLowerCase().split(/[^a-z0-9₹$€£%]+/).filter(w => w.length > 2 && !STOP.has(w)).map(stem);

function analyse(o, ws) {
  const out = { specificity:0, specificityTotal:0, generic:false, flatCascade:false, r3Flat:false, archetypes:0, estimates:0, unitClash:null };

  // (1) SUBSTITUTION TEST — does the card reference THIS user's world, or could it
  // be find-and-replaced onto any company in any market?
  // Two honesty rules here:
  //  - ARCHETYPE actor names are excluded from the pool. "Regional fabricator network"
  //    is precisely the generic language we are trying to detect; letting it into the
  //    pool would make the test grade itself.
  //  - If the user has not filled in a context pack there is nothing to measure against,
  //    so we do NOT accuse the card of being generic. An unmeasurable card is reported
  //    as unmeasured, and the missing pack already costs it confidence separately.
  const ctx = ws.ctx || {};
  const packTokens = toks([ctx.company, ctx.product, ctx.market, ctx.audience, ctx.roster].join(" "));
  const pool = new Set(packTokens);
  (o.actors || []).forEach(a => { if (a.basis !== "ARCHETYPE") toks(a.name).forEach(t => pool.add(t)); });
  out.measurable = packTokens.length >= 3;
  // A round is judged as a whole — the actor is displayed beside the move, so the move
  // itself is not required to repeat the name.
  const claims = [o.headline, o.only_true_here]
    .concat((o.rounds || []).map(r => (r.actor || "") + " " + (r.move || "") + " " + (r.net_effect || "")))
    .filter(c => c && c.trim());
  out.specificityTotal = claims.length;
  claims.forEach(c => { if (toks(c).some(t => pool.has(t))) out.specificity++; });
  out.generic = out.measurable && out.specificityTotal > 0 && out.specificity / out.specificityTotal < 0.45;

  // (2) does the cascade actually compound, or is triggered_by decorative?
  const R = o.rounds || [];
  if (R.length >= 3) {
    let linked = 0;
    for (let i = 1; i < 3; i++) {
      // The previous ACTOR name is deliberately excluded. Naming who moved last is
      // trivial and tells us nothing about whether the cause is real. The link has
      // to be to what they DID or what it CAUSED.
      const prev = new Set(toks((R[i-1].move || "") + " " + (R[i-1].net_effect || "")));
      if (toks(R[i].triggered_by).some(t => prev.has(t))) linked++;
    }
    out.flatCascade = linked < 2;
    // (3) round 3 must introduce something round 1 did not contain
    const r1 = new Set(toks((R[0].move || "") + " " + (R[0].net_effect || "") + " " + (R[0].actor || "")));
    const fresh = toks((R[2].move || "") + " " + (R[2].net_effect || "") + " " + (o.mechanism_new_in_r3 || "")).filter(t => !r1.has(t));
    out.r3Flat = fresh.length < 3;
  }

  // Did the local buying practice actually reach the answer? The model is handed it and
  // told to use it, but being told is not evidence. This checks the named practice
  // overlaps with what the user actually recorded.
  const bset = behaviourSet(ws);
  out.behaviourAvailable = bset > 0;
  const bu = (o.behaviour_used || "").trim();
  out.behaviourNamed = bu && !/^none given/i.test(bu);
  if (bset && out.behaviourNamed) {
    const pool = new Set(toks(behaviourLines(ws).join(" ")));
    out.behaviourUsed = toks(bu).some(t => pool.has(t));
  } else out.behaviourUsed = false;

  out.archetypes = (o.actors || []).filter(a => a.basis === "ARCHETYPE").length;
  out.estimates = (o.numbers_used || []).filter(n => n.source === "MY_ESTIMATE").length;

  // (4) the unit trap: two currency figures describing different things in the value chain
  // Rule 10 tells the model to write units out, so a figure often arrives as
  // "about eight percent" with no digit in it at all. Matching only numerals meant
  // this check almost never fired.
  const NUMWORD = /\d|percent|per cent|[₹$€£]|\b(one|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|forty|fifty|half|double|triple|quarter)\b/i;
  const cur = (o.numbers_used || []).filter(n => NUMWORD.test(n.value || ""));
  const refs = [...new Set(cur.map(n => (n.applies_to || "").toLowerCase().trim()))].filter(Boolean);
  if (cur.length >= 2 && refs.length >= 2) out.unitClash = refs;

  return out;
}

/* Confidence is computed here and is explainable. The model never states it. */
/* Five checks, each worth points. Eight points available. The user can see the
   whole sum, because a score you cannot audit is just a mood with a number on it. */
function confidence(o, ws, an) {
  const rows = [];
  const packed = ctxComplete(ws);
  rows.push({
    name: "Your context",
    pts: packed >= 3 ? 2 : packed >= 1 ? 1 : 0, max: 2,
    detail: packed >= 3 ? "Filled in, " + packed + " of 4 fields."
      : packed >= 1 ? "Only " + packed + " of 4 fields filled in."
      : "Nothing saved, so the model is guessing your world.",
    fix: packed >= 3 ? "" : "Fill in the rest of your workspace context."
  });

  const nA = (o.actors || []).length;
  rows.push({
    name: "Real companies",
    pts: an.archetypes === 0 ? 2 : an.archetypes <= 1 ? 1 : 0, max: 2,
    detail: an.archetypes === 0 ? "All " + nA + " actors are named companies."
      : an.archetypes + " of " + nA + " actors " + (an.archetypes === 1 ? "is a generic placeholder" : "are generic placeholders") + ", like “local fabricators”.",
    fix: an.archetypes === 0 ? "" : "Add more real names under Competitors and Your channel."
  });

  rows.push({
    name: "No invented figures",
    pts: an.estimates === 0 ? 2 : 0, max: 2,
    detail: an.estimates === 0 ? "Every number is yours, or stated relative to yours."
      : an.estimates + (an.estimates > 1 ? " figures are" : " figure is") + " the model's own guess.",
    fix: an.estimates === 0 ? "" : "Set your price anchor so figures can be stated against it."
  });

  rows.push({
    name: "Specific to you",
    pts: (an.measurable && !an.generic) ? 1 : 0, max: 1,
    detail: !an.measurable ? "Cannot be checked, because no context is saved to compare against."
      : an.generic ? "Only " + an.specificity + " of " + an.specificityTotal + " claims mention anything from your world."
      : an.specificity + " of " + an.specificityTotal + " claims mention your company, market or named rivals.",
    fix: (an.measurable && !an.generic) ? "" : "Name your company, market and competitors in the workspace."
  });

  rows.push({
    name: "Local practice",
    pts: an.behaviourUsed ? 1 : 0, max: 1,
    detail: !an.behaviourAvailable ? "You have not recorded how buying works in this market, so the model used a generic assumption."
      : an.behaviourUsed ? "The answer turns on a local practice you recorded, not a generic assumption."
      : "You recorded how buying works here, but the answer does not visibly turn on any of it.",
    fix: an.behaviourAvailable ? (an.behaviourUsed ? "" : "Ask a narrower question, so local practice has something to bite on.")
      : "Fill in How buying works here in your workspace."
  });

  const cascadeOk = !an.flatCascade && !an.r3Flat;
  rows.push({
    name: "Each stage causes the next",
    pts: cascadeOk ? 1 : 0, max: 1,
    detail: cascadeOk ? "Each round is caused by the one before it."
      : an.flatCascade ? "The rounds do not link, so this is a list rather than a chain."
      : "The end state adds nothing that was not already true at the start.",
    fix: cascadeOk ? "" : "Ask a narrower question, or add detail so the chain has somewhere to go."
  });

  const score = rows.reduce((a, r) => a + r.pts, 0);
  const max = rows.reduce((a, r) => a + r.max, 0);
  const band = score >= 7 ? "Firm" : score >= 4 ? "Mixed" : "Thin";
  return { band, score, max, rows };
}

/* ============================================================
   GEMINI
   ============================================================ */
const MODEL = "gemini-3.5-flash-lite";

/* Google accepts two different credentials on this endpoint and they need
   DIFFERENT headers: an API key goes in x-goog-api-key, an OAuth access token
   goes in Authorization: Bearer. We never guess from the string's shape — we
   try one, and if Google says the key is invalid we try the other and keep
   whichever actually worked. Behaviour decides, not a prefix. */
function authHeader(key, mode) {
  return mode === "bearer" ? { "Authorization": "Bearer " + key } : { "x-goog-api-key": key };
}

async function callGemini(key, sys, user, schema, mode) {
  try {
    return await callGeminiOnce(key, sys, user, schema, mode || S.authMode || "key");
  } catch (e) {
    // Only worth a second attempt when the credential itself was rejected.
    if (e.reason === "API_KEY_INVALID" && !mode) {
      const alt = (S.authMode === "bearer") ? "key" : "bearer";
      const out = await callGeminiOnce(key, sys, user, schema, alt);
      S.authMode = alt; save();
      return out;
    }
    throw e;
  }
}

async function callGeminiOnce(key, sys, user, schema, mode) {
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent";
  const res = await fetch(url, {
    method:"POST",
    headers: Object.assign({ "Content-Type":"application/json" }, authHeader(key, mode)),
    body: JSON.stringify({
      systemInstruction:{ parts:[{ text: sys }] },
      contents:[{ role:"user", parts:[{ text: user }] }],
      generationConfig:{
        temperature:0.55, maxOutputTokens:4096,
        responseMimeType:"application/json", responseSchema:schema
      }
    })
  });
  if (!res.ok) {
    let detail = "", reason = "";
    try {
      const j = await res.json();
      detail = (j.error && j.error.message) || "";
      const det = (j.error && j.error.details) || [];
      const info = det.find(d => d.reason) || {};
      reason = info.reason || (j.error && j.error.status) || "";
    } catch (e) {}
    const err = new Error(detail || ("HTTP " + res.status));
    err.status = res.status; err.reason = reason; err.mode = mode;
    throw err;
  }
  const j = await res.json();
  const cand = (j.candidates || [])[0];
  if (!cand) { const e = new Error("The model returned nothing."); e.kind = "empty"; throw e; }
  if (cand.finishReason && cand.finishReason !== "STOP") {
    const e = new Error("The answer was cut off (" + cand.finishReason + ")."); e.kind = "truncated"; throw e;
  }
  // Never read parts[0] on a thinking model — the reasoning part carries no text.
  const text = (cand.content && cand.content.parts || []).map(p => p.text).filter(Boolean).join("");
  if (!text) { const e = new Error("The model returned no answer text."); e.kind = "empty"; throw e; }
  try { return JSON.parse(text); }
  catch (e) { const er = new Error("The model's answer was not valid JSON."); er.kind = "parse"; throw er; }
}

/* Shape normalisation: minItems is a hint, not a guarantee. */
function normalise(o) {
  o.rounds = (o.rounds || []).slice().sort((a, b) => (a.round || 0) - (b.round || 0));
  const seen = new Set();
  o.rounds = o.rounds.filter(r => { const k = r.round; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 3);
  o.rounds.forEach((r, i) => { r.round = i + 1; r.risk = r.risk || { text:"", severity:"MEDIUM", signal:"" }; });
  o.actors = (o.actors || []).slice(0, 4);
  o.next_questions = (o.next_questions || []).slice(0, 3);
  o.evidence_gaps = (o.evidence_gaps || []).slice(0, 3);
  o.numbers_used = (o.numbers_used || []).slice(0, 6);
  return o;
}

/* ============================================================
   REVEAL SCHEDULER
   Paints on a local timer. Network arrival only ever makes it
   paint no earlier than these floors, so the cascade feels the
   same at 300ms or 9s, and demo mode is the reference build.
   ============================================================ */
const FLOORS = { verdict:420, headline:900, flips:1250, r1:1650, r2:2200, r3:2750, mech:3050, actors:3300, block:3600, gaps:3850, next:4020 };

/* Stages are named for the job they do in the story. A reader should never have to
   translate a label before understanding it. */
const STAGE = ["What happens first", "What that sets off", "Where it ends up"];
const HZ = {
  WEEKS:"in a few weeks", ONE_QUARTER:"within a quarter", TWO_QUARTERS:"within six months",
  ONE_YEAR:"within a year", BEYOND_A_YEAR:"beyond a year"
};
const TICKS = ["Reading what you asked", "Working out who is involved", "What happens first", "What that sets off", "Where it ends up", "Checking the numbers"];

async function revealCard(host, data, an, conf, mode, fast) {
  const F = fast ? Object.fromEntries(Object.entries(FLOORS).map(([k, v]) => [k, v * 0.28])) : FLOORS;
  const t0 = performance.now();
  const at = ms => sleep(Math.max(0, ms - (performance.now() - t0)));

  host.innerHTML = "";
  const card = el("div", "card" + (an.generic ? " generic" : ""));
  host.appendChild(card);

  const bar = el("div", "cbar"); card.appendChild(bar);
  const body = el("div", "cbody"); card.appendChild(body);

  await at(F.verdict);
  const callMap = { HOLDS:["call-holds","Holds"], HOLDS_WITH_CHANGES:["call-changes","Holds, with changes"],
                    BREAKS:["call-breaks","Breaks"], MALFORMED_PREMISE:["call-malformed","Premise is off"] };
  const cm = callMap[data.call] || callMap.HOLDS_WITH_CHANGES;
  const cc = el("span", "chip " + cm[0], cm[1]); cc.classList.add("fadein"); bar.appendChild(cc);

  const cf = el("button", "chip conf fadein", conf.band);
  cf.title = "How this was scored"; cf.onclick = () => showConfidence(conf, an);
  bar.appendChild(cf);
  if (an.generic) { const g = el("span", "chip call-changes fadein", "Generic read"); bar.appendChild(g); }
  const mchip = el("button", "chip mode fadein", modeById(mode).name);
  mchip.title = "Run this question as a different kind of simulation";
  mchip.onclick = () => {
    const c = activeChat();
    const lastUser = c && [...c.turns].reverse().find(t => t.role === "user");
    if (!lastUser) return;
    openModes(id => { S.forcedMode = null; doRun(lastUser.text, id); });
  };
  bar.appendChild(mchip);

  await at(F.headline);
  const h = el("h2", "headline fadein", words(data.headline, 14)); body.appendChild(h);

  await at(F.flips);
  if (data.only_true_here) {
    const o = el("div", "onlyhere fadein");
    o.appendChild(el("span", "lb", "Only true here"));
    o.appendChild(el("span", "", words(data.only_true_here, 16)));
    body.appendChild(o);
  }
  if (data.behaviour_used && !/^none given/i.test(data.behaviour_used.trim())) {
    const bx = el("div", "onlyhere fadein");
    bx.appendChild(el("span", "lb", "Because of how this market works"));
    bx.appendChild(el("span", "", words(data.behaviour_used, 20)));
    body.appendChild(bx);
  }
  if (data.flips_if) {
    const f = el("div", "flips fadein");
    f.appendChild(el("span", "lb", "Flips if"));
    f.appendChild(el("span", "", words(data.flips_if, 18)));
    body.appendChild(f);
  }

  /* ---- cascade ---- */
  const sect = el("div", "sect"); card.appendChild(sect);
  const hd = el("div", "secthd", an.flatCascade ? "How this plays out, though it does not really escalate" : "How this plays out");
  sect.appendChild(hd);
  const casc = el("div", "cascade"); sect.appendChild(casc);

  const byName = {}; (data.actors || []).forEach(a => byName[a.name] = a);

  for (let i = 0; i < (data.rounds || []).length; i++) {
    await at([F.r1, F.r2, F.r3][i] || F.r3);
    const r = data.rounds[i];
    const row = el("div", "rnd fadein"); row.dataset.r = String(i + 1);

    // The stage is named by what it does in the story, not by a round number.
    // "R2" tells the reader nothing their eyes did not already know from the spine.
    const stage = el("div", "rstage");
    stage.appendChild(el("span", "rstagename", STAGE[i] || "Later still"));
    stage.appendChild(el("span", "rhz", HZ[r.horizon] || "soon"));
    row.appendChild(stage);

    const who = el("div", "ractor");
    who.appendChild(el("span", "", words(r.actor, 6)));
    const ac = byName[r.actor];
    if (ac && ac.basis === "ARCHETYPE") who.appendChild(el("span", "rarch", "a type, not a named company"));
    row.appendChild(who);

    if (i > 0 && r.triggered_by) {
      row.appendChild(el("div", "rtrig", "Because " + words(r.triggered_by, 13)));
    }
    row.appendChild(el("div", "rmove", words(r.move, 20)));
    const ne = el("div", "rnet");
    ne.appendChild(el("span", "ar", "For you"));
    ne.appendChild(el("span", "", words(r.net_effect, 16)));
    row.appendChild(ne);
    if (r.risk && r.risk.text) {
      const rk = el("div", "rrisk" + (r.risk.severity === "HIGH" ? " high" : ""));
      rk.appendChild(el("span", "rl", r.risk.severity === "HIGH" ? "The big risk here" : "Risk here"));
      rk.appendChild(el("div", "rt", words(r.risk.text, 16)));
      if (r.risk.signal) {
        const sg = el("div", "rs");
        sg.appendChild(el("b", "", "Watch for:"));
        sg.appendChild(el("span", "", words(r.risk.signal, 14)));
        rk.appendChild(sg);
      }
      row.appendChild(rk);
    }
    // Tapping a stage turns it into the next question, which is the cheapest
    // possible way to make the cascade interactive rather than static.
    const probe = el("button", "rprobe", "What would stop this?");
    probe.onclick = () => {
      const q = "What would stop this: " + words(r.move, 14);
      $("#ta").value = q; autosize(); updateSend(); $("#ta").focus();
      $("#ta").scrollIntoView({ block:"nearest" });
    };
    row.appendChild(probe);
    casc.appendChild(row);
  }

  await at(F.mech);
  if (data.mechanism_new_in_r3 && !an.r3Flat) {
    const nm = el("div", "newmech fadein");
    nm.appendChild(el("span", "lb", "New by the end"));
    nm.appendChild(el("span", "", words(data.mechanism_new_in_r3, 16)));
    sect.appendChild(nm);
  }

  /* ---- who moves this ----
     The model produces what each actor wants and what each can do to you, and
     until now none of it was ever rendered. Each one opens an interview. */
  await at(F.actors);
  if ((data.actors || []).length) {
    const asec = el("div", "sect fadein"); card.appendChild(asec);
    const ah = el("div", "secthd");
    ah.appendChild(el("span", "", "Who moves this"));

/* ------------------------------------------------------------
   THE RESEARCH BRIEF

   Sightline has no web search, deliberately. But other models do.
   This writes a brief you paste into one of those, which returns a
   markdown file Sightline imports to fill the whole workspace.
   The structure is fixed and dull on purpose, because it has to
   survive a round trip through a model that has never seen it.
   ------------------------------------------------------------ */
function researchBrief(ws) {
  const who = (ws.ctx.company || "").trim() || "[PUT YOUR COMPANY NAME HERE]";
  const opts = BEHAVIOUR.map(b => "  " + b.id + ": one of " + b.opts.map(o => QL + o[0] + QR).join(" | ")).join(NL);
  return [
"You have web search. I need you to research a company and return ONE markdown file.",
"",
"COMPANY: " + who,
"INDUSTRY: facade and fenestration. Aluminium window and curtain wall systems, glass, and the",
"building envelope. This is a physical, specification led, project based business.",
"",
"WHY THIS MATTERS: the file goes into a market simulator that has no internet access. Anything you",
"get wrong becomes an assumption it treats as fact. Accuracy matters more than completeness.",
"",
"RULES",
"1. Search before you write. Do not answer from memory alone.",
"2. Only real, verifiable companies and bodies. If you are not confident a name exists and operates",
"   in this market, leave it out. A short correct list beats a long invented one.",
"3. Put every name in the RIGHT section. Competitors are competing system houses and brands only,",
"   never a supplier and never a customer. Getting this wrong makes the simulator ask the user the",
"   wrong questions later.",
"4. Get the business model right and say it plainly. A SYSTEM HOUSE sells profiles, hardware and",
"   engineering to independent fabricators. A FABRICATOR sells the finished installed window. A",
"   GLASS PROCESSOR sells processed glass and units. An EXTRUDER sells aluminium sections.",
"5. NO PRICES. No market sizes, no shares, no growth rates in the profile fields. If a figure is",
"   genuinely important and you have a source, put it under Facts with the source and the date.",
"6. Under Facts, give things that are true, dated, and would change how someone reasons about this",
"   market: regulation with deadlines, trade measures, structural supply facts. Add the source URL.",
"7. Plain sentences. No dashes as punctuation, no slashes between words.",
"8. Return ONLY the markdown below. No preamble, no commentary, no code fence around the whole thing.",
"",
"RETURN EXACTLY THIS STRUCTURE",
"",
"# Sightline company profile",
"",
"## Company",
"Two sentences. Who they are and what they actually sell, naming the business model.",
"",
"## Product",
"One or two sentences on the product or system range.",
"",
"## Market",
"One sentence. Countries, segments, main cities.",
"",
"## Who decides",
"One or two sentences. Who specifies, who buys, who converts, who sets the rules.",
"",
"## Competitors",
"- One real competing system house or brand per line",
"",
"## Channel",
"- Fabricators, dealers, contractors who quote their systems",
"",
"## Customers",
"- Developers and contractors who buy at scale in that market",
"",
"## Suppliers",
"- Aluminium, glass and hardware suppliers",
"",
"## Bodies",
"- Standards, certification and trade remedy bodies",
"",
"## Facts",
"- A dated, sourced fact. Include the source URL in brackets at the end.",
"",
"## Behaviour",
"How buying actually works in this market. Use EXACTLY one of the listed values after each key,",
"copied character for character. Omit any line you cannot support.",
opts,
"",
"## Uncertain",
"- Anything you could not verify and the user should check themselves"
  ].join(NL);
}

/* Parse the returned markdown back into a workspace. Tolerant by design: it
   accepts any heading order, ignores anything it does not recognise, and never
   throws on a malformed file. */
function parseProfile(md) {
  const out = { ctx:{}, facts:[], behaviour:{}, uncertain:[] };
  const secs = {};
  let cur = null;
  md.split(/\r?\n/).forEach(line => {
    const h = line.match(/^\s*#{1,3}\s+(.+?)\s*$/);
    if (h) { cur = h[1].trim().toLowerCase(); secs[cur] = []; return; }
    if (cur) secs[cur].push(line);
  });
  const text = k => (secs[k] || []).join(" ").replace(/\s+/g, " ").trim();
  const list = k => (secs[k] || []).map(l => l.replace(/^\s*[-*+]\s*/, "").trim()).filter(Boolean);

  if (text("company")) out.ctx.company = text("company");
  if (text("product")) out.ctx.product = text("product");
  if (text("market")) out.ctx.market = text("market");
  if (text("who decides")) out.ctx.audience = text("who decides");
  const g = [["competitors","rivals"],["channel","channel"],["customers","customers"],
             ["suppliers","suppliers"],["bodies","bodies"]];
  g.forEach(([k, field]) => { const l = list(k); if (l.length) out.ctx[field] = l.join(", "); });
  out.facts = list("facts");
  out.uncertain = list("uncertain");

  (secs["behaviour"] || []).forEach(line => {
    const m = line.match(/^\s*[-*+]?\s*([a-z]+)\s*:\s*(.+?)\s*$/i);
    if (!m) return;
    const key = m[1].toLowerCase();
    const val = m[2].replace(/^[“"']|[”"']$/g, "").trim();
    const bq = BEHAVIOUR.find(b => b.id === key);
    if (!bq) return;
    const hit = bq.opts.find(o => o[0].toLowerCase() === val.toLowerCase());
    if (hit) out.behaviour[key] = hit[0];
  });
  return out;
}

/* ------------------------------------------------------------
   FOLLOW UP

   Not every message after an answer is a new simulation. Sometimes
   you want to ask why, or push back, or ask what it would take.
   Running a whole new card for that is wasteful and loses the
   thread, so a referential message gets a plain conversational
   reply about the card that is already on screen.
   ------------------------------------------------------------ */
const FOLLOWUP = /^(why|how come|what do you mean|explain|elaborate|say more|go on|really|are you sure|is that right|says who|prove|based on what|how did you|what about|and if|but what|so what|which of|who exactly|when exactly|can you|could you|tell me more|expand|unpack|justify|defend|disagree|i disagree|i doubt|that seems|not sure|convince me|what would it take|how confident|source)\b/i;

function looksLikeFollowUp(text, chat) {
  if (!chat || !chat.turns.some(t => t.role === "card")) return false;
  const t = text.trim();
  if (FOLLOWUP.test(t)) return true;
  // Short and referential, with no scenario of its own.
  const wordCount = t.split(/\s+/).length;
  if (wordCount <= 9 && /\b(it|that|this|they|them|those|your|you)\b/i.test(t) && !inferMode(t)) return true;
  return false;
}

const FOLLOWUP_SCHEMA = {
  type:"object",
  properties:{
    answer:{ type:"string", description:"A direct answer to what was asked, grounded in the card already on screen. Plain sentences. MAX 70 WORDS." },
    basis:{ type:"string", enum:["FROM_THE_CARD","FROM_YOUR_CONTEXT","MY_GENERAL_KNOWLEDGE","I_DO_NOT_KNOW"] },
    changes_the_read:{ type:"string", description:"Whether this changes the original read, and how. Write exactly: no change, if it does not. MAX 16 WORDS." }
  },
  required:["answer","basis","changes_the_read"],
  propertyOrdering:["answer","basis","changes_the_read"]
};

function followUpPrompt(card, mode, ws) {
  return `You produced this read for a facade and fenestration business, and the user is now asking
you about it. Answer their question directly. This is a conversation, not a new simulation.

THE READ ON SCREEN:
CLAIM: ` + (card.headline || "") + `
ONLY TRUE HERE: ` + (card.only_true_here || "") + `
LOCAL PRACTICE USED: ` + (card.behaviour_used || "") + `
HOW IT PLAYS OUT:
` + (card.rounds || []).map((r, i) => (STAGE[i] || "Later") + ": " + r.actor + " " + r.move +
    ". For you: " + r.net_effect + ". Risk: " + ((r.risk && r.risk.text) || "")).join(NL) + `
IT FLIPS IF: ` + (card.flips_if || "") + `
WHAT IS UNKNOWN: ` + (card.evidence_gaps || []).map(g => g.unknown).join("; ") + `

CONTEXT:
` + contextPack(ws) + `

HOW TO ANSWER:

2. Say where your answer comes from, in the basis field, and be honest about it. If it rests on the

3. If the user pushes back and they are right, say they are right and say what changes. Do not

5. If answering properly would need a fresh simulation rather than a conversation, say so and name

function demoFollowUp(q) {

/* ------------------------------------------------------------
   CHALLENGE THE READ

   A confident answer does not provoke thinking. Two credible
   answers that disagree do. This asks the model to build the
   strongest honest case against its own read, then to judge
   which is more likely, and it is explicitly permitted to
   conclude the original was right. Without that permission it
   manufactures a counter every time, which is worthless.
   ------------------------------------------------------------ */
const CHALLENGE_SCHEMA = {
  type:"object",
  properties:{
    counter_headline:{ type:"string", description:"The opposing read, as a claim with a verb. MAX 12 WORDS." },
    who_holds_this:{ type:"string", description:"Who in this market would genuinely argue this, named where possible. MAX 10 WORDS." },
    case_against:{ type:"array", minItems:3, maxItems:3, items:{ type:"object", properties:{
      point:{ type:"string", description:"A real weakness in the original read, not a strawman. MAX 16 WORDS." },
      why_it_bites:{ type:"string", description:"Why this actually undermines the original. MAX 14 WORDS." }
    }, required:["point","why_it_bites"], propertyOrdering:["point","why_it_bites"] } },
    original_missed:{ type:"string", description:"The single thing the original read did not account for. MAX 14 WORDS." },
    more_likely:{ type:"string", enum:["ORIGINAL","COUNTER","GENUINELY_UNCERTAIN"] },
    why:{ type:"string", description:"Why that one is more likely. Honest, not diplomatic. MAX 18 WORDS." },
    decisive_test:{ type:"string", description:"The one thing you could observe or ask that would settle which is right. MAX 16 WORDS." }
  },
  required:["counter_headline","who_holds_this","case_against","original_missed","more_likely","why","decisive_test"],
  propertyOrdering:["counter_headline","who_holds_this","case_against","original_missed","more_likely","why","decisive_test"]
};

function challengePrompt(data, mode, ws) {
  return `You produced this read of a facade and fenestration situation:

CLAIM: ` + (data.headline || "") + `
ONLY TRUE HERE: ` + (data.only_true_here || "") + `
HOW IT PLAYS OUT:
` + (data.rounds || []).map((r, i) => (STAGE[i] || "Later") + ": " + r.actor + " " + r.move + ". For you: " + r.net_effect).join(NL) + `
IT FLIPS IF: ` + (data.flips_if || "") + `

CONTEXT:
` + contextPack(ws) + `

NOW ARGUE AGAINST YOURSELF.

1. Build the STRONGEST HONEST case that this read is wrong. Do not build a weak one so the original
   wins. Find the real weakness, the assumption doing the most work, the actor whose behaviour was
   taken for granted.
2. Never strawman the original. If you have to distort it to attack it, you have not found the
   weakness yet.
3. Name who in this market would genuinely hold the opposing view. A real position held by real
   people, not a debating exercise.
4. Then JUDGE HONESTLY which is more likely. You are fully permitted to conclude the ORIGINAL was
   right. A challenge that always overturns the original is worthless, and so is one that always
   defers to it. If it is genuinely a coin toss, say so.
5. Give the ONE thing that could be observed or asked to settle it. This is the most valuable field.
   It must be something a person could actually go and find out this month, not "more research".
6. Never invent a number. Write plain sentences, no dashes, no slashes between words.`;
}

/* ------------------------------------------------------------
   INTERVIEW AN ACTOR

   The single most useful interactive thing this can do. A report

   is a different kind of understanding, and it is where a reader
   starts arguing with the answer instead of accepting it.
   ------------------------------------------------------------ */
const INTERVIEW_SCHEMA = {
  type:"object",
  properties:{
    answer:{ type:"string", description:"Your reply, in first person, in role. Candid, specific, not corporate. MAX 45 WORDS." },
    what_it_reveals:{ type:"string", description:"Written for the person asking, not in role. What this answer should tell them. MAX 14 WORDS." },
    would_change_my_mind:{ type:"string", description:"In role. The one thing that would genuinely change your position. MAX 14 WORDS." }
  },
  required:["answer","what_it_reveals","would_change_my_mind"],
  propertyOrdering:["answer","what_it_reveals","would_change_my_mind"]
};

function interviewPrompt(actor, data, ws) {
  return `You are ` + actor.name + `, in the facade and fenestration industry.

WHO YOU ARE: ` + (actor.kind || "an actor") + ` in this market.
WHAT YOU WANT: ` + actor.wants + `
WHAT YOU CAN ACTUALLY DO: ` + actor.lever + `

THE SITUATION YOU ARE IN:
` + (data.headline || "") + `
` + (data.rounds || []).map(r => r.actor + ": " + r.move).join(NL) + `

HOW THIS MARKET WORKS:
` + (behaviourLines(ws).join(NL) || "Not described.") + `

You are being questioned by someone from ` + (ws.ctx.company || "a system house") + `. They can hear you.

HOW TO ANSWER:
1. First person, in role, always. You are not an analyst and you never step outside the character
   to give advice. Say "I" and "we", not "the fabricator would".
2. Be candid. Say the thing this person would not say to their face, because that is the entire

const INTERVIEW_SEEDS = {
  RIVAL: ["Why would you go after us here?", "What would make you back off?", "Where do you think we are weakest?"],
  CHANNEL: ["Why would you switch away from us?", "What would keep you loyal?", "What do you tell the customer about us?"],
  SPECIFIER: ["Why would you write us out of the spec?", "What would make you insist on us?", "What do you actually check?"],
  BUYER: ["Why would you not buy from us?", "What would justify paying more?", "Who really decides this?"],
  REGULATOR: ["What would you enforce first?", "Who do you check and who do you not?", "What gets an exemption?"],
  SUPPLIER: ["Who do you supply first when it is tight?", "What are your terms really?", "What would you drop?"],
  INTERNAL: ["What are we getting wrong?", "What would you stop doing?", "What are you not telling leadership?"]
};

function demoInterview(actor, q) {

      ". That is the whole of it. When the pressure comes I will do whatever protects that, and the fact that we have worked together a long time will not change the arithmetic. If you want a different answer from me, change the arithmetic.",
    what_it_reveals: "Their loyalty follows their economics, not the relationship",
    would_change_my_mind: "Terms that make staying with you the cheaper option"
  };
}

function openInterview(actor, data, mode) {
  const ws = activeWs();
  const turns = [];
  openSheet("Talking to " + actor.name, s => {
    const ctx = el("div", "notice");
    ctx.innerHTML = "<span>You are questioning <b>" + esc(actor.name) + "</b>. They answer in role, and they will say things they would not say to your face. " +
      (actor.basis === "ARCHETYPE" ? "This is a type rather than a named company, so treat it as illustrative." : "") + "</span>";
    s.appendChild(ctx);

    const log = el("div", "ilog"); s.appendChild(log);

    const seeds = el("div", "clopts");
    (INTERVIEW_SEEDS[actor.kind] || INTERVIEW_SEEDS.RIVAL).forEach(q => {
      const b = el("button", "clopt", q);
      b.onclick = () => ask(q);
      seeds.appendChild(b);
    });
    s.appendChild(seeds);

    const f = el("div", "fld");
    const inp = el("input"); inp.placeholder = "Ask them something";
    inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) { const q = inp.value.trim(); inp.value = ""; ask(q); } };
    f.appendChild(inp);
    s.appendChild(f);

        else out = await callGemini(S.key, interviewPrompt(actor, data, ws), q, INTERVIEW_SCHEMA);
      } catch (e) { err = e; }
      pend.remove();
      if (err) {
        const e2 = el("div", "err");
        e2.innerHTML = "<b>They did not answer.</b> " + esc(err.message || "Unknown error");

      const a = el("div", "ia");
      a.appendChild(el("div", "iatxt", out.answer));
      if (out.what_it_reveals) {

        r.appendChild(el("span", "lb", "What that tells you"));
        r.appendChild(el("span", "", out.what_it_reveals));

        c.appendChild(el("span", "lb", "What would change their mind"));
        c.appendChild(el("span", "", out.would_change_my_mind));
        a.appendChild(c);
      }
      log.appendChild(a);
      turns.push({ q, a: out });
      a.scrollIntoView({ block:"nearest" });
    }
  });
}

function markNumbers(text, nums) {
  let out = esc(text);
  (nums || []).forEach(n => {
    if (!n.value) return;
    const v = esc(String(n.value));
    if (out.indexOf(v) === -1) return;
    const cls = n.source === "USER_PROVIDED" ? "num given" : "num";
    const title = esc((n.source === "USER_PROVIDED" ? "Your figure" : n.source === "RELATIVE_TO_ANCHOR" ? "Relative to your anchor" : "Model estimate, verify this") + ". " + (n.applies_to || ""));
    out = out.split(v).join('<span class="' + cls + '" title="' + title + '">' + v + "</span>");
  });
  return out;
}

function cardToText(d, mode, conf) {
  const L = [];
  L.push(modeById(mode).name.toUpperCase() + ". " + (d.call || "").replace(/_/g, " "));
  L.push("");
  L.push(d.headline);
  if (d.only_true_here) L.push("Only true here: " + d.only_true_here);
  if (d.behaviour_used && !/^none given/i.test(d.behaviour_used)) L.push("Because of how this market works: " + d.behaviour_used);
  if (d.flips_if) L.push("Flips if: " + d.flips_if);
  L.push("");
  (d.rounds || []).forEach((r, i) => {
    L.push((STAGE[i] || "Later still") + ", " + (HZ[r.horizon] || "soon") + ". " + r.actor);
    if (r.triggered_by && i > 0) L.push("   Because " + r.triggered_by);
    L.push("   " + r.move);
    L.push("   For you: " + r.net_effect);
    if (r.risk && r.risk.text) L.push("   Risk (" + r.risk.severity.toLowerCase() + "): " + r.risk.text + ". Watch for: " + r.risk.signal);
  });
  if (d.mechanism_new_in_r3) L.push(NL + "New by the end: " + d.mechanism_new_in_r3);
  const sh = shapeOf(mode); const mv = d.mode_block || {};
  L.push(NL + sh.title.toUpperCase());
  const shape = modeById(mode).shape;
  if (shape === "ladder") {
    (mv.rungs || []).forEach(r => L.push("  " + (r.position || "") + " (" + r.move + "): " + r.what_happens + ". You lose: " + r.who_walks));
    if (mv.floor_risk) L.push("  Priced too low: " + mv.floor_risk);
  } else if (shape === "funnel") {
    (mv.stages || []).forEach(x => L.push("  " + x.stage + " [" + (x.standing || "").replace(/_/g, " ").toLowerCase() + "]: " + x.why));
    if (mv.biggest_leak) L.push("  Most of the loss: " + mv.biggest_leak);
  } else if (shape === "claimtest") {
    if (mv.claim) L.push("  Promise: " + mv.claim);
    (mv.doubters || []).forEach(x => L.push("  " + x.who + " doubts: " + x.doubt));
    if (mv.proof) L.push("  What closes it: " + mv.proof);
    if (mv.cost_if_wrong) L.push("  If it is wrong: " + mv.cost_if_wrong);
  } else if (shape === "exposure") {
    (mv.exposures || []).forEach(x => L.push("  " + x.who + " [" + (x.hit || "").toLowerCase() + ", " + (HZ[x.when] || "soon") + ", " + (x.control || "").replace(/_/g, " ").toLowerCase() + "]: " + x.note));
    if (mv.lever) L.push("  Your one lever: " + mv.lever);
  } else {
    if (mv.their_pitch) L.push("  How they sell it: " + mv.their_pitch);
    (mv.lines || []).forEach(x => {
      L.push("  They say: " + x.they_say);
      L.push("    Lands because " + x.lands_because);
      L.push("    You say: " + x.you_say + "  [" + (x.strength || "").replace(/_/g, " ").toLowerCase() + "]");
    });
  }
  if ((d.evidence_gaps || []).length) {
    L.push("\nWHAT WOULD CHANGE THIS");
    d.evidence_gaps.forEach(g => L.push("  • " + g.unknown + ". " + g.why));
  }
  L.push("\nConfidence: " + conf.band + " (" + conf.score + " out of " + conf.max + ")");
  conf.rows.forEach(r => L.push("  " + r.pts + " of " + r.max + "  " + r.name + ". " + r.detail));
  L.push("\nSightline. Exploratory reasoning, not market data. Verify before acting.");
  return L.join("\n");
}

function trackSignals(d, mode) {
  const ws = activeWs(); const chat = activeChat(); let n = 0;
  // A signal with no context is noise. Each one carries the simulation it came
  // from, the question that produced it, and the stage it belongs to, so the
  // tray can group them rather than presenting a flat list of loose warnings.
  const asked = chat ? ([...chat.turns].reverse().find(t => t.role === "user") || {}).text : "";
  (d.rounds || []).forEach((r, i) => {
    if (!r.risk || !r.risk.signal) return;
    if (S.signals.some(x => x.text === r.risk.signal && x.chatId === (chat && chat.id))) return;
    S.signals.push({ id:uid(), wsId:ws.id, wsName:ws.name,
      chatId: chat ? chat.id : null, chatTitle: chat ? chat.title : "Untitled",
      question: asked || "", stage: STAGE[i] || "Later still",
      text:r.risk.signal, risk:r.risk.text, severity:r.risk.severity,
      headline: d.headline || "", horizon:r.horizon, mode:mode,
      created:Date.now(), state:"open" });
    n++;
  });
  save(); renderSignalCount();
  toast(n ? n + " signal" + (n === 1 ? "" : "s") + " added to this simulation" : "Those signals are already tracked");
}

/* ============================================================
   RUN
   ============================================================ */
let busy = false;
async function run(text, useMode) {
  if (busy) return;
  if (useMode) S.mode = useMode;
  const ws = activeWs();
  let c = activeChat();
  if (!c) {
    c = { id:uid(), wsId:ws.id, title:words(text, 6), turns:[], updated:Date.now() };
    S.chats.push(c); S.activeChat = c.id;
  }
  c.turns.push({ role:"user", text, mode:S.mode });
  c.updated = Date.now();
  save(); renderRail();

  const box = $("#streamIn");
  const uw = el("div", "uturn"); const ub = el("div", "ubub");
  ub.appendChild(el("span", "umode", modeById(S.mode).name));
  ub.appendChild(el("span", "", text));
  uw.appendChild(ub); box.appendChild(uw);

  const host = el("div"); box.appendChild(host);
  busy = true; updateSend();

  // skeleton + ticker, replaced the instant the card starts painting
  const sk = el("div", "card"); sk.style.padding = "15px 14px";
  const tick = el("div", "ticker");
  tick.appendChild(el("span", "dot"));
  const tl = el("span", "", TICKS[0]); tick.appendChild(tl);
  sk.appendChild(tick);
  [70, 92, 55].forEach(w => { const l = el("div", "sk skl"); l.style.width = w + "%"; sk.appendChild(l); });
  host.appendChild(sk);
  let ti = 0;
  const tint = setInterval(() => { ti = (ti + 1) % TICKS.length; tl.textContent = TICKS[ti]; }, 900);
  scrollDown();

  const mode = S.mode;
  let data = null, errTurn = null;
  try {
    if (!S.key) {
      await sleep(560);
      data = JSON.parse(JSON.stringify(DEMO[mode] || DEMO.rival_response));
      if (!DEMO[mode]) data.headline = "Demo card. Add a key to simulate this mode for real.";
    } else {
      data = await callGemini(S.key, systemPrompt(mode, ws), text, buildSchema(mode));
    }
    normalise(data);
  } catch (e) {
    const st = e.status;
    if (e.reason === "API_KEY_INVALID") {
      errTurn = { role:"error", title:"Google rejected this credential.", body:" Open Settings and press Test key. It will say precisely which cause it is, and show you Google's own words.", action:"Open key settings" };
    } else if (st === 403) {
      errTurn = { role:"error", title:"The key is real but not permitted here.", body:" Either the Generative Language API is not enabled on its project, or the key is restricted to an Android app, a website, or an IP address. Press Test key in Settings for the detail.", action:"Open key settings" };
    } else if (st === 404) {
      errTurn = { role:"error", title:"The key works, the model does not.", body:" This project cannot reach " + MODEL + ", usually because billing is not active on it.", action:"Open key settings" };
    } else if (st === 429) {
      errTurn = { role:"error", title:"Rate limited.", body:" Google is throttling this key, usually a free tier quota. Wait a minute, or enable billing on the key's project.", action:"Open key settings" };
    } else if (e.kind === "truncated") {
      errTurn = { role:"error", title:"The answer was cut off.", body:" The model ran out of room before finishing. Try a shorter, more specific question." };
    } else if (e.kind === "parse" || e.kind === "empty") {
      errTurn = { role:"error", title:"The model returned nothing usable.", body:" This happens occasionally. Send it again, it usually works the second time." };
    } else if (/Failed to fetch|NetworkError/i.test(e.message || "")) {
      errTurn = { role:"error", title:"Could not reach Google.", body:" You are offline, or a network policy is blocking the request. Saved chats still work." };
    } else {
      errTurn = { role:"error", title:"That did not work.", body:" " + (e.message || "Unknown error") };
    }
  }

  clearInterval(tint);
  if (errTurn) {
    host.innerHTML = "";
    const e = el("div", "err");
    e.innerHTML = "<b>" + esc(errTurn.title) + "</b>" + esc(errTurn.body);
    if (errTurn.action) {
      const f = el("div", "fix"); const b = el("button", "", errTurn.action);
      b.onclick = openSettings; f.appendChild(b); e.appendChild(f);
    }
    host.appendChild(e);
    c.turns.push(errTurn);
  } else {
    const an = analyse(data, ws);
    const conf = confidence(data, ws, an);
    c.turns.push({ role:"card", data, mode, an, conf });
    await revealCard(host, data, an, conf, mode, false);
  }
  c.updated = Date.now();
  busy = false; save(); renderRail(); updateSend(); scrollDown();
}

function applyProfile(ws, id, md) {
  let p = null;
  try { p = parseProfile(md); } catch (e) { p = null; }
  const filled = p ? Object.keys(p.ctx).length : 0;
  if (!p || (!filled && !p.facts.length)) {
    toast("That file did not contain a profile Sightline could read");
    return;
  }
  Object.keys(p.ctx).forEach(k => { if (p.ctx[k]) ws.ctx[k] = p.ctx[k]; });
  if (p.facts.length) {
    ws.facts = ws.facts || [];
    p.facts.forEach(t => { if (!ws.facts.some(f => f.text === t)) ws.facts.push({ text:t, at:Date.now() }); });
  }
  if (Object.keys(p.behaviour).length) {
    ws.behaviour = Object.assign({}, ws.behaviour || {}, p.behaviour);
    ws.behaviourSource = "";
  }
  if (p.uncertain.length) ws.pendingCheck = p.uncertain;
  save(); renderRail(); renderStream(); openWorkspace(id);
  toast("Imported " + filled + " fields, " + p.facts.length + " facts, " +
        Object.keys(p.behaviour).length + " behaviour answers");
}

/* ============================================================
   GOOGLE DRIVE SYNC

   The data lives in the user's own Drive, in a private folder
   that only this app can see. There is no server here and there
   never will be. Google handles who you are, Drive handles where
   things go, and nothing passes through anything of mine.

   Two deliberate exclusions from what gets synced:
     the Gemini key, because an API key does not belong in a file
     that travels, even a private one, and
     the access token, which is short lived and device specific.

   Conflicts are resolved by asking. Silently overwriting a day of
   someone's work to avoid a dialogue is not a trade worth making.
   ============================================================ */
const GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const GDRIVE_FILE = "sightline-data.json";
let gisReady = false, tokenClient = null;

function gsync() { return (S.gsync = S.gsync || { clientId:"", auto:true, fileId:"", lastSync:0, lastPulledAt:0 }); }

/* What travels. Everything about your work, nothing about your credentials. */
function syncPayload() {
  return {
    v: 1,
    updatedAt: S.updatedAt || 0,
    theme: S.theme || "",
    mode: S.mode,
    workspaces: S.workspaces,
    chats: S.chats,
    signals: S.signals
  };
}
function applyPayload(p) {
  if (!p || !Array.isArray(p.workspaces) || !p.workspaces.length) return false;
  S.workspaces = p.workspaces;
  S.chats = Array.isArray(p.chats) ? p.chats : [];
  S.signals = Array.isArray(p.signals) ? p.signals : [];
  if (p.mode) S.mode = p.mode;
  S.updatedAt = p.updatedAt || 0;
  if (!S.workspaces.some(w => w.id === S.activeWs)) S.activeWs = S.workspaces[0].id;
  if (!S.chats.some(c => c.id === S.activeChat)) S.activeChat = null;
  repairText(S);
  return true;
}

function loadGIS() {
  if (gisReady) return Promise.resolve(true);
  if (location.protocol !== "https:" && location.hostname !== "localhost") return Promise.resolve(false);
  return new Promise(res => {
    const sc = document.createElement("script");
    sc.src = "https://accounts.google.com/gsi/client";
    sc.async = true; sc.defer = true;
    sc.onload = () => { gisReady = true; res(true); };
    sc.onerror = () => res(false);
    document.head.appendChild(sc);
    setTimeout(() => res(gisReady), 8000);
  });
}

function gToken() {
  const g = gsync();
  return (g.token && g.tokenExp && Date.now() < g.tokenExp - 60000) ? g.token : null;
}

async function gSignIn(interactive) {
  const g = gsync();
  if (!g.clientId) throw new Error("No client ID set. Add one in Settings first.");
  const ok = await loadGIS();
  if (!ok || !window.google || !google.accounts) throw new Error("Could not reach Google sign in. Check your connection, or an extension may be blocking it.");
  return new Promise((res, rej) => {
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: g.clientId,
        scope: GDRIVE_SCOPE,
        callback: r => {
          if (r && r.access_token) {
            g.token = r.access_token;
            g.tokenExp = Date.now() + ((r.expires_in || 3600) * 1000);
            save(); res(g.token);
          } else rej(new Error("Google did not return access."));
        },
        error_callback: e => rej(new Error((e && e.type === "popup_closed") ? "Sign in was closed before it finished." : "Google sign in failed."))
      });
      tokenClient.requestAccessToken({ prompt: interactive ? "consent" : "" });
    } catch (e) { rej(e); }
  });
}

async function gFetch(url, opts) {
  const t = gToken() || await gSignIn(false);
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({ Authorization: "Bearer " + t }, o.headers || {});
  const r = await fetch(url, o);
  if (r.status === 401) { gsync().token = ""; throw new Error("Google signed you out. Sign in again."); }
  if (!r.ok) {
    let m = "";
    try { const j = await r.json(); m = (j.error && j.error.message) || ""; } catch (e) {}
    throw new Error(m || ("Drive returned " + r.status));
  }
  return r;
}

async function gFindFile() {
  const g = gsync();
  const r = await gFetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&pageSize=20");
  const j = await r.json();
  const f = (j.files || []).find(x => x.name === GDRIVE_FILE);
  g.fileId = f ? f.id : "";
  return f || null;
}

async function gPush() {
  const g = gsync();
  if (!g.fileId) {
    await gFindFile();
    if (!g.fileId) {
      const r = await gFetch("https://www.googleapis.com/drive/v3/files", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ name: GDRIVE_FILE, parents:["appDataFolder"] })
      });
      g.fileId = (await r.json()).id;
    }
  }
  const body = JSON.stringify(syncPayload());
  await gFetch("https://www.googleapis.com/upload/drive/v3/files/" + g.fileId + "?uploadType=media", {
    method:"PATCH", headers:{ "Content-Type":"application/json" }, body
  });
  g.lastSync = Date.now(); g.lastPulledAt = S.updatedAt || 0;
  save(); return body.length;
}

async function gPull() {
  const g = gsync();
  const f = await gFindFile();
  if (!f) return null;
  const r = await gFetch("https://www.googleapis.com/drive/v3/files/" + g.fileId + "?alt=media");
  const txt = await r.text();
  try { return JSON.parse(txt); } catch (e) { throw new Error("The file in Drive could not be read."); }
}

/* Decide what to do, and ask when the answer is genuinely ambiguous. */
async function gSync(opts) {
  const g = gsync();
  const remote = await gPull();
  const localAt = S.updatedAt || 0;
  const remoteAt = remote ? (remote.updatedAt || 0) : -1;

  if (!remote) { const n = await gPush(); return { did:"pushed", bytes:n, reason:"nothing was in Drive yet" }; }
  if (remoteAt === localAt) { g.lastSync = Date.now(); save(); return { did:"same", reason:"both copies already match" }; }

  const localChangedSincePull = localAt > (g.lastPulledAt || 0);
  if (remoteAt > localAt && !localChangedSincePull) {
    applyPayload(remote); g.lastSync = Date.now(); g.lastPulledAt = S.updatedAt || 0; save();
    return { did:"pulled", reason:"Drive was newer and nothing here had changed" };
  }
  if (localAt > remoteAt && !(remote && remoteAt > (g.lastPulledAt || 0))) {
    const n = await gPush(); return { did:"pushed", bytes:n, reason:"this device was newer" };
  }
  if (opts && opts.resolve === "mine") { const n = await gPush(); return { did:"pushed", bytes:n, reason:"you chose this device" }; }
  if (opts && opts.resolve === "theirs") {
    applyPayload(remote); g.lastSync = Date.now(); g.lastPulledAt = S.updatedAt || 0; save();
    return { did:"pulled", reason:"you chose the Drive copy" };
  }
  return { did:"conflict", localAt, remoteAt,
           localCounts:{ w:S.workspaces.length, c:S.chats.length },
           remoteCounts:{ w:(remote.workspaces||[]).length, c:(remote.chats||[]).length } };
}

            tb.textContent = "Test key";
            report("ok", "That is an OAuth token, not an API key.", "Sightline has switched to bearer authentication for it, and it works. Note that OAuth tokens expire, often within the hour. An AI Studio API key does not.");
            return;
          } catch (e2) {
            tb.textContent = "Test key";
            report("err", "Google rejected this credential both ways.",
              "It is not a valid API key and not a valid OAuth token. There are three usual causes. It was copied incompletely, it was <b>revoked or regenerated</b>, or it is restricted in Google Cloud Console to an Android app or to specific websites. A key restricted to an Android package will always refuse a browser. Create a fresh unrestricted key at <b>aistudio.google.com</b> and paste that one.",
              e2.message);
            return;
          }
        }
        tb.textContent = "Test key";
        if (e1.status === 403) {
          report("err", "The key is real but not allowed here.",
            "Usually one of two things. Either the <b>Generative Language API is not enabled</b> on this key's Google Cloud project, or the key carries an application restriction, such as an Android app, a website, or an IP address, that a local page cannot satisfy.", e1.message);
        } else if (e1.status === 404) {
          report("err", "The key is fine, but the model is not reachable.",
            "This project cannot see <b>" + MODEL + "</b>. That usually means billing is not active on it.", e1.message);
        } else if (/Failed to fetch|NetworkError/i.test(e1.message || "")) {
          report("err", "Could not reach Google at all.",
            "This is a network problem, not a key problem. You are offline, or a firewall or extension is blocking the request. The key was never tested.", e1.message);
        } else {
          report("err", "That did not work.", esc(e1.message || "Unknown error"), e1.message);

    s.appendChild(test);

    const n = el("div", "notice");

    /* ---- Google Drive sync ---- */
    const g = gsync();
    const sy = el("div", "fld");

    const canSync = location.protocol === "https:" || location.hostname === "localhost";

      const setup = el("details", "gaps"); setup.style.borderTop = "none";
      const sm = el("summary");
      sm.appendChild(el("span", "tw", QL === QL ? "›" : ""));
      sm.appendChild(el("span", "", g.clientId ? "Change the Google setup" : "First, a five minute setup on Google"));
      setup.appendChild(sm);
      const steps = el("div", "gaplist");
      const st = el("div", "confbox");

        "<li>Open <b>APIs and Services</b>, then <b>Library</b>. Search for <b>Google Drive API</b> and press Enable.</li>" +
        "<li>Open <b>OAuth consent screen</b>. Choose External, give it a name, and add your own email as a test user. Leave it in Testing. That allows up to a hundred people and needs no review.</li>" +
        "<li>Open <b>Credentials</b>, then <b>Create credentials</b>, then <b>OAuth client ID</b>. Choose <b>Web application</b>.</li>" +

        "<li>Create it, copy the <b>Client ID</b>, and paste it below. It ends in <b>.apps.googleusercontent.com</b>.</li>" +

      steps.appendChild(st);
      setup.appendChild(steps);
      sy.appendChild(setup);

      const ci = el("input");
      ci.placeholder = "Paste your Client ID, ending in .apps.googleusercontent.com";

      sy.appendChild(ci);

      const st2 = el("div", "hint");

<meta charset="utf-8">
<title>Sightline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Test a pricing, launch, tender or competitor decision for facade and fenestration, and see how the market answers.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sightline">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">

<style>
/* ============================================================
   SIGHTLINE
   Airbnb warmth (roundness, soft depth, generous air, one
   geometric typeface) over Apple's discipline (huge tight
   headlines, #F5F5F7 ground, hairline dividers, pill buttons,
   almost no colour until colour means something).
   ============================================================ */

:root{
  --paper:#F5F5F7;
  --surface:#FFFFFF;
  --surface-2:#F7F7F9;
  --ink:#1D1D1F;
  --ink-2:#6E6E73;
  --ink-3:#6F6F75;
  --line:#E3E3E6;
  --line-2:#EFEFF1;
  --accent:#0071E3;
  --accent-ink:#0067CE;
  --accent-soft:#EBF4FE;
  --sev-low:#6E6E73;
  --sev-med:#8A5008;
  --sev-med-soft:#FDF3E4;
  --sev-high:#C0362B;
  --sev-high-soft:#FCEDEB;
  --ok:#1C7A54;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,.09);
  --r-card:18px;
  --r-box:12px;
  --r-pill:999px;
  --fs:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --fs-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#000000;
    --surface:#161618;
    --surface-2:#1F1F22;
    --ink:#F5F5F7;
    --ink-2:#A1A1A6;
    --ink-3:#95959D;
    --line:#2E2E32;
    --line-2:#242427;
    --accent:#2997FF;
    --accent-ink:#5AAEFF;
    --accent-soft:#10243A;
    --sev-low:#A1A1A6;
    --sev-med:#E8A33D;
    --sev-med-soft:#2B2113;
    --sev-high:#FF7A66;
    --sev-high-soft:#2E1714;
    --ok:#4CC38A;
    --sh-1:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
    --sh-2:0 2px 6px rgba(0,0,0,.55),0 14px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#000000;
  --surface:#161618;
  --surface-2:#1F1F22;
  --ink:#F5F5F7;
  --ink-2:#A1A1A6;
  --ink-3:#95959D;
  --line:#2E2E32;
  --line-2:#242427;
  --accent:#2997FF;
  --accent-ink:#5AAEFF;
  --accent-soft:#10243A;
  --sev-low:#A1A1A6;
  --sev-med:#E8A33D;
  --sev-med-soft:#2B2113;
  --sev-high:#FF7A66;
  --sev-high-soft:#2E1714;
  --ok:#4CC38A;
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.55),0 14px 34px rgba(0,0,0,.5);
}

*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--fs);font-size:15px;line-height:1.55;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:4px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}

/* ---------- shell ---------- */
.app{display:flex;height:100dvh;overflow:hidden}

.rail{
  width:290px;flex:0 0 290px;background:var(--surface);
  border-right:1px solid var(--line-2);display:flex;flex-direction:column;z-index:40;
}
.rail-head{padding:22px 20px 14px;display:flex;align-items:center;gap:10px}
.wordmark{font-weight:700;font-size:19px;letter-spacing:-.03em}
.rail-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px 8px}
.rail-foot{padding:10px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line-2)}

.newbtn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:12px 16px;border-radius:var(--r-pill);
  background:var(--ink);color:var(--surface);font-weight:600;font-size:14.5px;
  margin-bottom:20px;transition:transform .18s ease,opacity .18s ease;
}
.newbtn:hover{opacity:.88;transform:scale(1.015)}
.newbtn:active{transform:scale(.985)}

.wsgroup{margin-bottom:14px}
.wshead{
  display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border-radius:10px;
  font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:0;min-height:30px;
}
.wshead .caret{display:block}
.wshead .ct{line-height:1}
.wshead:hover{color:var(--ink-2)}
.wshead .caret{transition:transform .2s ease;flex:0 0 auto;opacity:.7}
.wsgroup.collapsed .caret{transform:rotate(-90deg)}
.wsgroup.collapsed .wslist{display:none}
.wshead .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wshead .ct{font-weight:500;color:var(--ink-3);opacity:.75}
.gear{
  opacity:0;flex:0 0 auto;padding:3px;border-radius:6px;transition:opacity .15s;
  display:grid;place-items:center;line-height:0;align-self:center;
}
.gear svg{display:block}
.wshead:hover .gear{opacity:.7}
.gear:hover{opacity:1 !important;background:var(--surface-2)}

.wslist{display:flex;flex-direction:column;gap:1px;padding:4px 0 0}
.chatrow{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:9px 12px;border-radius:10px;font-size:14px;color:var(--ink-2);text-align:left;
  transition:background .15s;
}
.chatrow:hover{background:var(--surface-2);color:var(--ink)}
.chatrow.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.chatrow .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatrow .x{opacity:0;font-size:17px;line-height:1;padding:0 2px;color:var(--ink-3);transition:opacity .15s}
.chatrow:hover .x{opacity:.6}
.chatrow .x:hover{opacity:1 !important;color:var(--sev-high)}
.emptyhint{padding:8px 12px;font-size:13px;color:var(--ink-3)}

.railbtn{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 12px;border-radius:10px;font-size:14px;color:var(--ink-2);text-align:left;
  transition:background .15s;
}
.railbtn:hover{background:var(--surface-2);color:var(--ink)}
.railbtn .badge{
  margin-left:auto;font-size:11.5px;font-weight:700;
  background:var(--sev-med);color:#fff;min-width:20px;text-align:center;
  padding:1px 7px;border-radius:var(--r-pill);
}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--paper)}
.topbar{
  display:flex;align-items:center;gap:12px;padding:14px 22px;min-height:64px;
  background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-2);position:relative;z-index:10;
}
.hamb{display:none;padding:7px;border-radius:10px}
.topttl{flex:1;font-weight:600;font-size:16px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topmeta{
  font-size:13px;color:var(--ink-3);white-space:nowrap;padding:6px 12px;
  border-radius:var(--r-pill);border:1px solid var(--line);transition:background .15s,color .15s;
}
.topmeta:hover{background:var(--surface-2);color:var(--ink)}
.topmeta.warn{color:var(--sev-med);border-color:var(--sev-med)}
.iconbtn{padding:8px;border-radius:var(--r-pill);color:var(--ink-2);transition:background .15s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

.stream{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.streamin{max-width:748px;margin:0 auto;padding:32px 24px 40px;display:flex;flex-direction:column;gap:26px}

/* ---------- welcome ---------- */
.welcome{padding:26px 0 4px;text-align:center}
.wtag{font-size:14px;font-weight:600;color:var(--accent-ink);margin-bottom:18px;letter-spacing:0}
.wtitle{
  font-weight:700;font-size:clamp(30px,7.4vw,50px);line-height:1.05;letter-spacing:-.035em;
  margin:0 auto 18px;max-width:15ch;text-wrap:balance;
}
.wsub{
  color:var(--ink-2);max-width:52ch;margin:0 auto 34px;font-size:16.5px;line-height:1.5;
  letter-spacing:-.011em;
}
.wsub b{color:var(--ink);font-weight:600}

.seedgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:26px;text-align:left}
@media(min-width:640px){.seedgrid{grid-template-columns:1fr 1fr}}
.seed{
  text-align:left;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-card);
  background:var(--surface);display:flex;flex-direction:column;gap:7px;
  transition:box-shadow .22s ease,transform .22s ease,border-color .22s ease;
}
.seed:hover{box-shadow:var(--sh-2);transform:translateY(-2px);border-color:transparent}
.seed .sm{font-size:12.5px;font-weight:600;color:var(--accent-ink)}
.seed .sq{font-size:15px;line-height:1.42;color:var(--ink);letter-spacing:-.012em}

.notice{
  display:flex;gap:12px;padding:16px 18px;border-radius:var(--r-box);
  background:var(--surface);border:1px solid var(--line);font-size:14px;
  color:var(--ink-2);line-height:1.5;text-align:left;
}
.notice b{color:var(--ink);font-weight:600}
.notice a{color:var(--accent-ink);cursor:pointer;font-weight:500;text-decoration:none;border-bottom:1px solid currentColor}
.notice a:hover{opacity:.75}

/* ---------- turns ---------- */
.uturn{display:flex;justify-content:flex-end}
.ubub{
  background:var(--ink);color:var(--paper);padding:13px 19px;border-radius:22px 22px 6px 22px;
  max-width:84%;font-size:15.5px;line-height:1.45;letter-spacing:-.012em;
}
.uturn .umode{display:block;font-size:12.5px;font-weight:600;opacity:.6;margin-bottom:3px}

/* ---------- the readout card ---------- */
.card{
  background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-card);box-shadow:var(--sh-1);overflow:hidden;
}
.card.generic{border-color:var(--sev-med)}

.cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:18px 22px 0}
.chip{
  font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:var(--r-pill);
  white-space:nowrap;border:1px solid transparent;letter-spacing:-.005em;
}
.chip.call-holds{background:var(--accent-soft);color:var(--accent-ink)}
.chip.call-changes{background:var(--sev-med-soft);color:var(--sev-med)}
.chip.call-breaks{background:var(--sev-high-soft);color:var(--sev-high)}
.chip.call-malformed{background:var(--sev-high-soft);color:var(--sev-high)}
.chip.conf{background:transparent;border-color:var(--line);color:var(--ink-2);cursor:pointer;transition:border-color .15s}
.chip.conf:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.mode{background:transparent;color:var(--ink-3);margin-left:auto;padding-right:0}

.cbody{padding:12px 22px 4px}
.headline{
  font-weight:700;font-size:clamp(22px,5vw,29px);line-height:1.18;letter-spacing:-.032em;
  margin:0 0 11px;text-wrap:balance;
}
.flips{
  display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);
  padding:12px 14px;background:var(--surface-2);border-radius:var(--r-box);margin-bottom:4px;
  line-height:1.45;
}
.flips .lb{font-size:14.5px;font-weight:600;color:var(--sev-med);flex:0 0 auto}
.onlyhere{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);padding:0 0 10px;line-height:1.45}
.onlyhere .lb{font-size:14.5px;font-weight:600;color:var(--accent-ink);flex:0 0 auto}

/* ---------- cascade ---------- */
.sect{padding:18px 22px 0}
.secthd{font-size:13px;font-weight:600;color:var(--ink-3);margin-bottom:12px;letter-spacing:0}

.cascade{position:relative;padding-left:30px}
.cascade::before{
  content:"";position:absolute;left:5px;top:9px;bottom:22px;width:2px;
  background:var(--line);border-radius:2px;
}
.rnd{position:relative;padding-bottom:18px}
.rnd::before{
  content:"";position:absolute;left:-30px;top:5px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink-3);
}
.rnd[data-r="2"]::before{border-color:var(--sev-med)}
.rnd[data-r="3"]::before{border-color:var(--sev-high);background:var(--sev-high)}

.rstage{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:1px}
.rstagename{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:0}
.ractor{
  font-weight:600;font-size:16.5px;color:var(--ink);letter-spacing:-.024em;margin-bottom:5px;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;line-height:1.25;
}
.rhz{font-size:12.5px;color:var(--ink-3);background:var(--surface-2);padding:2px 9px;border-radius:var(--r-pill);white-space:nowrap}
.rarch{font-size:12px;font-weight:500;color:var(--ink-3);background:var(--surface-2);padding:2px 8px;border-radius:var(--r-pill)}
.rtrig{font-size:13.5px;color:var(--ink-3);margin-bottom:5px;line-height:1.4;font-style:italic}
.rmove{font-size:15.5px;line-height:1.45;margin-bottom:5px;letter-spacing:-.014em}
.rnet{font-size:14.5px;color:var(--ink-2);display:flex;gap:8px;line-height:1.45}
.rnet .ar{color:var(--ink-3);font-weight:600;flex:0 0 auto}
.rnet .ar::after{content:":"}
.rnd[data-r="3"] .rstagename{color:var(--sev-high)}
.rrisk{margin-top:10px;padding:11px 13px;border-radius:var(--r-box);background:var(--sev-med-soft)}
.rrisk.high{background:var(--sev-high-soft)}
.rrisk .rl{font-size:12.5px;font-weight:700;color:var(--sev-med);display:block;margin-bottom:4px}
.rrisk.high .rl{color:var(--sev-high)}
.rrisk .rt{font-size:14.5px;line-height:1.45;color:var(--ink);letter-spacing:-.012em}
.rrisk .rs{font-size:13.5px;color:var(--ink-2);margin-top:5px;display:flex;gap:6px;line-height:1.4}
.rrisk .rs b{font-weight:600}

.newmech{
  margin-top:2px;padding:15px 17px;border-radius:var(--r-box);background:var(--accent-soft);
  font-size:14.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;
}
.newmech .lb{font-size:14.5px;font-weight:600;color:var(--accent-ink);flex:0 0 auto}

/* ---------- mode block ---------- */
.mblock{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-box);overflow:hidden}
.mrow{display:flex;flex-direction:column;gap:4px;padding:14px 17px;background:var(--surface-2)}
.mrow .k{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.mrow .v{font-size:15px;line-height:1.48;letter-spacing:-.013em}
.mrow .v .tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:var(--r-pill);margin-right:8px}
.tag.buys{background:var(--accent-soft);color:var(--accent-ink)}
.tag.negotiates{background:var(--sev-med-soft);color:var(--sev-med)}
.tag.ignores{background:var(--sev-high-soft);color:var(--sev-high)}

.num{border-bottom:1.5px dotted var(--sev-med);cursor:help}
.num.given{border-bottom-color:var(--ok)}
.unitwarn{
  margin-top:12px;display:flex;gap:10px;padding:14px 16px;border-radius:var(--r-box);
  background:var(--sev-high-soft);font-size:14px;line-height:1.45;
}
.unitwarn .lb{font-size:14px;font-weight:700;color:var(--sev-high);flex:0 0 auto}

/* ---------- gaps ---------- */
details.gaps{margin-top:20px;border-top:1px solid var(--line-2)}
details.gaps summary{
  padding:16px 22px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;gap:9px;list-style:none;transition:color .15s;
}
details.gaps summary::-webkit-details-marker{display:none}
details.gaps summary:hover{color:var(--ink)}
details.gaps summary .cnt{
  background:var(--surface-2);color:var(--ink-2);padding:1px 9px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:600;
}
details.gaps[open] summary .tw{transform:rotate(90deg)}
details.gaps summary .tw{transition:transform .2s;display:inline-block;color:var(--ink-3)}
.gaplist{padding:0 22px 18px;display:flex;flex-direction:column;gap:12px}
.gap{padding:14px 16px;background:var(--surface-2);border-radius:var(--r-box);font-size:14px}
.gap .gu{font-weight:600;margin-bottom:4px;letter-spacing:-.014em}
.gap .gw{color:var(--ink-2);line-height:1.45}
.gap .gh{margin-top:8px;font-size:13px;font-weight:600;color:var(--accent-ink)}

/* ---------- next ---------- */
.nextwrap{padding:20px 22px 22px;border-top:1px solid var(--line-2)}
.nexthd{font-size:13px;font-weight:600;color:var(--ink-3);margin-bottom:12px}
.nextlist{display:flex;flex-direction:column;gap:9px}
.nextq{
  text-align:left;padding:15px 18px;border:1px solid var(--line);border-radius:var(--r-box);
  background:var(--surface);display:flex;flex-direction:column;gap:4px;
  transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;
}
.nextq:hover{box-shadow:var(--sh-1);border-color:transparent;transform:translateY(-1px)}
.nextq .nq{font-size:15px;line-height:1.4;letter-spacing:-.014em}
.nextq .nl{font-size:12.5px;font-weight:600;color:var(--accent-ink)}

.cfoot{display:flex;gap:8px;padding:0 22px 20px;flex-wrap:wrap}
.fbtn{
  padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s;
}
.fbtn:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- skeleton ---------- */
.sk{
  background:linear-gradient(90deg,var(--line-2) 25%,var(--surface-2) 50%,var(--line-2) 75%);
  background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:6px;
}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}*{transition:none !important;animation:none !important}}
.skl{height:13px;margin-bottom:10px}
.ticker{font-size:14px;color:var(--ink-3);padding:0 0 16px;display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
.fadein{animation:fi .42s cubic-bezier(.2,.7,.3,1) both}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- composer ---------- */
.composer{padding:10px 24px calc(18px + env(safe-area-inset-bottom));background:var(--paper)}
.compin{max-width:748px;margin:0 auto}
.moderow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.modebtn{
  display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:var(--r-pill);
  border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink);
  background:var(--surface);white-space:nowrap;transition:box-shadow .18s,transform .18s;
}
.modebtn:hover{box-shadow:var(--sh-1);transform:translateY(-1px)}
.ctxpill{
  font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;text-align:right;cursor:pointer;transition:color .15s;
}
.ctxpill:hover{color:var(--ink-2)}
.ctxpill.warn{color:var(--sev-med);font-weight:500}

.inbox{
  display:flex;align-items:flex-end;gap:10px;border:1px solid var(--line);
  border-radius:26px;padding:8px 8px 8px 20px;background:var(--surface);
  box-shadow:var(--sh-1);transition:box-shadow .2s,border-color .2s;
}
.inbox:focus-within{box-shadow:var(--sh-2);border-color:transparent}
#ta{
  flex:1;border:none;outline:none;resize:none;background:transparent;
  font-size:16px;line-height:1.5;max-height:168px;padding:8px 0;letter-spacing:-.014em;
}
#ta::placeholder{color:var(--ink-3)}
.sendbtn{
  width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--ink);
  display:grid;place-items:center;color:var(--surface);
  transition:opacity .18s,transform .18s;
}
.sendbtn:disabled{opacity:.25;cursor:default}
.sendbtn:not(:disabled):hover{transform:scale(1.06)}
.sendbtn:not(:disabled):active{transform:scale(.94)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.scrim.on{display:flex}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{
  background:var(--surface);width:100%;max-width:580px;max-height:90dvh;overflow-y:auto;
  border-radius:24px 24px 0 0;box-shadow:var(--sh-2);animation:up .3s cubic-bezier(.2,.7,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:640px){.sheet{border-radius:20px;animation:fi .26s cubic-bezier(.2,.7,.3,1)}}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
.shead{
  display:flex;align-items:center;gap:12px;padding:20px 24px 14px;position:sticky;top:0;
  background:var(--surface);z-index:2;border-bottom:1px solid var(--line-2);
}
.shead h2{flex:1;margin:0;font-weight:700;font-size:20px;letter-spacing:-.028em}
.sbody{padding:20px 24px 28px;display:flex;flex-direction:column;gap:20px}

.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font-size:13.5px;font-weight:600;color:var(--ink)}
.fld input,.fld textarea{
  border:1px solid var(--line);border-radius:var(--r-box);padding:13px 15px;
  background:var(--surface);outline:none;font-size:15px;width:100%;transition:border-color .15s,box-shadow .15s;
}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld .hint{font-size:13px;color:var(--ink-3);line-height:1.45}
.fld textarea{resize:vertical;min-height:80px;font-family:var(--fs)}

.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  padding:11px 20px;border-radius:var(--r-pill);font-size:14.5px;font-weight:600;
  border:1px solid var(--line);color:var(--ink);background:var(--surface);
  transition:background .15s,transform .15s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.pri:hover{opacity:.88;background:var(--ink)}
.btn.danger{color:var(--sev-high);border-color:var(--sev-high)}

.modegrid{display:flex;flex-direction:column;gap:22px}
.modecat{display:flex;flex-direction:column;gap:8px}
.modecat h3{margin:0;font-size:13px;font-weight:600;color:var(--ink-3)}
.modeopt{
  display:flex;flex-direction:column;gap:3px;padding:14px 17px;text-align:left;
  border:1px solid var(--line);border-radius:var(--r-box);background:var(--surface);
  transition:box-shadow .18s,border-color .18s,transform .18s;
}
.modeopt:hover{box-shadow:var(--sh-1);border-color:transparent;transform:translateY(-1px)}
.modeopt.on{border-color:var(--ink);background:var(--surface-2)}
.modeopt .mn{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;letter-spacing:-.018em}
.modeopt .md{font-size:13.5px;color:var(--ink-2);line-height:1.42}
.newtag{
  font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);
  padding:2px 8px;border-radius:var(--r-pill);
}

.confbox{font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.confbox ul{margin:12px 0 0;padding-left:20px}
.confbox li{margin-bottom:7px}
.confbox b{color:var(--ink);font-weight:600}

.toast{
  position:fixed;bottom:104px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:var(--r-pill);
  font-size:14.5px;font-weight:600;z-index:120;box-shadow:var(--sh-2);
  opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-8px)}

.err{
  padding:16px 18px;border-radius:var(--r-box);background:var(--sev-high-soft);
  font-size:14.5px;line-height:1.5;color:var(--ink);
}
.err b{display:block;margin-bottom:4px;font-weight:700;color:var(--sev-high)}
.err .fix{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.err .fix button{
  font-size:13.5px;font-weight:600;padding:8px 16px;border:1px solid var(--sev-high);
  border-radius:var(--r-pill);color:var(--sev-high);transition:background .15s;
}
.err .fix button:hover{background:var(--surface)}


/* ---------- clarify panel ---------- */
.clarify[hidden]{display:none}
.clarify{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--sh-1);padding:16px 18px;margin-bottom:10px;
  display:flex;flex-direction:column;gap:14px;animation:fi .3s cubic-bezier(.2,.7,.3,1) both;
}
.clhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.clttl{flex:1;font-size:14.5px;font-weight:600;letter-spacing:-.016em}
.clskip{font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.clskip:hover{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.clq{display:flex;flex-direction:column;gap:8px}
.clqt{font-size:13.5px;color:var(--ink-2);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.clmulti{font-size:12px;color:var(--ink-3);background:var(--surface-2);padding:1px 8px;border-radius:var(--r-pill)}
.clopts{display:flex;flex-wrap:wrap;gap:7px}
.clopt{
  padding:7px 14px;border-radius:var(--r-pill);border:1px solid var(--line);
  font-size:13.5px;font-weight:500;color:var(--ink);background:var(--surface);
  transition:border-color .15s,background .15s,transform .15s;
}
.clopt:hover{border-color:var(--ink-3)}
.clopt:active{transform:scale(.97)}
.clopt.on{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.clfoot{display:flex;align-items:center;gap:12px;padding-top:2px}
.clprev{flex:1;font-size:13px;color:var(--ink-3)}
.clprev.has{color:var(--accent-ink);font-weight:500}
.clgo{
  padding:10px 20px;border-radius:var(--r-pill);background:var(--ink);color:var(--surface);
  font-size:14px;font-weight:600;white-space:nowrap;transition:opacity .18s,transform .18s;
}
.clgo:hover{opacity:.88}
.clgo:active{transform:scale(.97)}
@media(max-width:899px){
  .clarify{padding:14px 15px;border-radius:var(--r-box)}
  .clopt{font-size:13px;padding:7px 12px}
}


.clstep{flex:1;font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.clsrc{font-size:12px;color:var(--ink-3);background:var(--surface-2);padding:1px 8px;border-radius:var(--r-pill)}
.clfree{margin-top:4px}
.clfree input{
  width:100%;border:1px solid var(--line);border-radius:var(--r-box);padding:11px 14px;
  background:var(--surface);outline:none;font-size:14.5px;
}
.clfree input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.clback{
  padding:10px 18px;border-radius:var(--r-pill);border:1px solid var(--line);
  font-size:14px;font-weight:600;color:var(--ink-2);transition:background .15s;
}
.clback:hover{background:var(--surface-2);color:var(--ink)}
.clprev{text-align:center}


/* ---------- confidence explainer ---------- */
.confscore{display:flex;flex-direction:column;gap:14px}
.confbig{display:flex;align-items:baseline;gap:10px}
.confnum{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1}
.confof{font-size:15px;color:var(--ink-3)}
.confmeter{display:flex;gap:6px}
.confseg{
  flex:1;padding:9px 10px;border-radius:var(--r-box);background:var(--surface-2);
  display:flex;flex-direction:column;gap:2px;border:1px solid transparent;
}
.confseg.on{background:var(--accent-soft);border-color:var(--accent)}
.confseg .cs1{font-size:13.5px;font-weight:600;color:var(--ink-3)}
.confseg.on .cs1{color:var(--accent-ink)}
.confseg .cs2{font-size:12px;color:var(--ink-3)}
.conflist{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-box);overflow:hidden}
.confrow{display:flex;gap:13px;padding:13px 15px;background:var(--surface-2);align-items:flex-start}
.confpts{
  flex:0 0 auto;font-size:13px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink-2);font-variant-numeric:tabular-nums;
}
.confrow.full .confpts{background:var(--accent-soft);color:var(--accent-ink)}
.confrow.part .confpts{background:var(--sev-med-soft);color:var(--sev-med)}
.confrow.zero .confpts{background:var(--sev-high-soft);color:var(--sev-high)}
.confbody{flex:1}
.confname{font-size:14.5px;font-weight:600;letter-spacing:-.015em;margin-bottom:2px}
.confdetail{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.conffix{display:flex;flex-direction:column;gap:8px}
.conffixrow{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);line-height:1.45}
.conffixpts{
  flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--accent-ink);
  background:var(--accent-soft);padding:2px 8px;border-radius:var(--r-pill);
}


.typerow[hidden]{display:none}
.typerow{
  display:flex;align-items:center;gap:8px;margin:0 0 8px 4px;padding:5px 12px 5px 6px;
  border-radius:var(--r-pill);font-size:13px;color:var(--ink-3);align-self:flex-start;
  width:fit-content;transition:background .15s;
}
.typerow:hover{background:var(--surface-2)}
.typelb{color:var(--ink-3)}
.typeval{font-weight:600;color:var(--ink)}
.typechg{color:var(--accent-ink);font-weight:600}
.chip.mode{cursor:pointer}
.chip.mode:hover{color:var(--ink)}


/* ---------- the five shapes ---------- */
.shapenote{
  margin-top:10px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;
  border-radius:var(--r-box);background:var(--surface-2);font-size:14px;line-height:1.45;
}
.shapenote .lb{font-size:14px;font-weight:600;color:var(--ink-3);flex:0 0 auto}
.shapenote.alert{background:var(--sev-high-soft)}
.shapenote.alert .lb{color:var(--sev-high)}
.shapenote.good{background:var(--accent-soft)}
.shapenote.good .lb{color:var(--accent-ink)}

/* ladder */
.ladder{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-box);overflow:hidden}
.rung{padding:13px 15px;background:var(--surface-2);border-left:3px solid transparent}
.rung.below{border-left-color:var(--sev-med)}
.rung.at{border-left-color:var(--accent);background:var(--accent-soft)}
.rung.above{border-left-color:var(--sev-high)}
.runghd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.rungpos{font-size:13px;font-weight:700;color:var(--ink-3)}
.rung.at .rungpos{color:var(--accent-ink)}
.rungmove{font-size:13px;color:var(--ink-2)}
.rungwhat{font-size:14.5px;line-height:1.45;letter-spacing:-.012em}
.rungwalk{margin-top:6px;font-size:13.5px;color:var(--ink-2);display:flex;gap:7px;line-height:1.4}
.rungwalk .wl{font-weight:600;color:var(--ink-3);flex:0 0 auto}

/* battlecard */
.pitch{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-box);
  background:var(--surface-2);font-size:14px;line-height:1.45;margin-bottom:10px;
}
.pitch .lb{font-size:14px;font-weight:600;color:var(--ink-3);flex:0 0 auto}
.bcard{display:flex;flex-direction:column;gap:10px}
.bline{padding:14px 16px;border-radius:var(--r-box);background:var(--surface-2);position:relative}
.bline.hard{background:var(--sev-high-soft)}
.blb{font-size:12.5px;font-weight:700;color:var(--ink-3);display:block;margin-bottom:3px}
.bline.hard .bthey .blb{color:var(--sev-high)}
.btxt{font-size:14.5px;line-height:1.45;letter-spacing:-.012em}
.bthey .btxt{font-style:italic}
.bwhy{font-size:13px;color:var(--ink-2);margin:7px 0;line-height:1.4;display:flex;gap:6px}
.bwl{font-weight:600;color:var(--ink-3);flex:0 0 auto}
.byou{margin-top:9px;padding-top:11px;border-top:1px solid var(--line-2)}
.byou .blb{color:var(--accent-ink)}
.bstr{
  display:inline-block;margin-top:9px;font-size:12px;font-weight:600;padding:2px 9px;
  border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);
}
.bline.hard .bstr{background:var(--sev-high);color:var(--surface)}
.bline.weak .bstr{background:var(--accent-soft);color:var(--accent-ink)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-box);overflow:hidden}
.fstage{padding:13px 15px;background:var(--surface-2);border-left:3px solid var(--line)}
.fstage.strong{border-left-color:var(--accent)}
.fstage.holding{border-left-color:var(--ink-3)}
.fstage.risk{border-left-color:var(--sev-med);background:var(--sev-med-soft)}
.fstage.lost{border-left-color:var(--sev-high);background:var(--sev-high-soft)}
.fhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.fname{font-size:15px;font-weight:600;letter-spacing:-.018em}
.fstand{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.fstage.strong .fstand{color:var(--accent-ink)}
.fstage.risk .fstand{color:var(--sev-med)}
.fstage.lost .fstand{color:var(--sev-high)}
.fwhy{font-size:14px;color:var(--ink-2);line-height:1.45}

/* claim test */
.claim{padding:14px 16px;border-radius:var(--r-box);background:var(--surface-2);margin-bottom:10px}
.claim .lb{font-size:12.5px;font-weight:700;color:var(--ink-3);display:block;margin-bottom:4px}
.claimtxt{font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.02em}
.doubters{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-box);overflow:hidden}
.doubt{padding:12px 15px;background:var(--surface-2)}
.dwho{font-size:14.5px;font-weight:600;letter-spacing:-.016em;margin-bottom:2px}
.ddoubt{font-size:14px;color:var(--ink-2);line-height:1.45}

/* exposure */
.expo{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-box);overflow:hidden}
.exprow{padding:13px 15px;background:var(--surface-2);border-left:3px solid var(--line)}
.exprow.hard{border-left-color:var(--sev-high);background:var(--sev-high-soft)}
.exprow.mid{border-left-color:var(--sev-med)}
.exphd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.expwho{font-size:15px;font-weight:600;letter-spacing:-.018em}
.exphit{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.exprow.hard .exphit{color:var(--sev-high)}
.expwhen{font-size:12.5px;color:var(--ink-3);background:var(--surface);padding:2px 9px;border-radius:var(--r-pill)}
.expnote{font-size:14px;color:var(--ink-2);line-height:1.45;margin-bottom:7px}
.expctl{font-size:12px;font-weight:600;padding:2px 9px;border-radius:var(--r-pill);display:inline-block}
.expctl.yours{background:var(--accent-soft);color:var(--accent-ink)}
.expctl.shared{background:var(--surface);color:var(--ink-2)}
.expctl.not{background:var(--sev-high-soft);color:var(--sev-high)}


/* ---------- actors and interview ---------- */
.secthd .sechint{font-weight:500;color:var(--ink-3);opacity:.85;margin-left:8px}
.actors{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:620px){.actors{grid-template-columns:1fr 1fr}}
.actor{
  text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-box);
  background:var(--surface);display:flex;flex-direction:column;gap:5px;
  transition:box-shadow .2s,border-color .2s,transform .2s;
}
.actor:hover{box-shadow:var(--sh-1);border-color:transparent;transform:translateY(-1px)}
.actor.arch{border-style:dashed}
.ahd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.aname{font-size:15.5px;font-weight:600;letter-spacing:-.02em}
.akind{font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface-2);padding:2px 8px;border-radius:var(--r-pill)}
.arow{display:flex;gap:8px;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.arow .al{font-weight:600;color:var(--ink-3);flex:0 0 42px}
.aarch{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.4}

.rprobe{
  margin-top:9px;font-size:13px;font-weight:600;color:var(--accent-ink);
  padding:5px 12px;border:1px solid var(--line);border-radius:var(--r-pill);
  transition:border-color .15s,background .15s;
}
.rprobe:hover{border-color:var(--accent);background:var(--accent-soft)}

.ilog{display:flex;flex-direction:column;gap:12px}
.iq{
  align-self:flex-end;max-width:88%;background:var(--ink);color:var(--paper);
  padding:10px 15px;border-radius:18px 18px 5px 18px;font-size:14.5px;line-height:1.4;
}
.ia{background:var(--surface-2);border-radius:18px 18px 18px 5px;padding:14px 16px;max-width:96%}
.ia.pending{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-3)}
.iatxt{font-size:15px;line-height:1.5;letter-spacing:-.012em}
.iarev,.iachg{display:flex;gap:8px;margin-top:10px;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.iarev .lb{font-weight:600;color:var(--accent-ink);flex:0 0 auto}
.iachg .lb{font-weight:600;color:var(--sev-med);flex:0 0 auto}


/* ---------- the counter case ---------- */
.challenge{
  margin:0 22px 18px;padding:16px 18px;border-radius:var(--r-box);
  background:var(--surface-2);border:1px dashed var(--line);
}
.chhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.chlb{font-size:13px;font-weight:700;color:var(--sev-med)}
.chwho{font-size:13px;color:var(--ink-3)}
.chhead{
  font-size:18px;font-weight:700;line-height:1.28;letter-spacing:-.025em;
  margin-bottom:13px;text-wrap:balance;
}
.chlist{display:flex;flex-direction:column;gap:10px;margin-bottom:11px}
.chpt{padding-left:13px;border-left:2px solid var(--sev-med)}
.chptxt{font-size:14.5px;line-height:1.45;letter-spacing:-.012em}
.chwhy{font-size:13.5px;color:var(--ink-2);line-height:1.4;margin-top:3px}
.chverdict{margin-top:11px;padding:13px 15px;border-radius:var(--r-box);background:var(--surface)}
.chverdict.orig{border-left:3px solid var(--accent)}
.chverdict.counter{border-left:3px solid var(--sev-high)}
.chverdict.uncertain{border-left:3px solid var(--sev-med)}
.chvlb{font-size:15px;font-weight:600;letter-spacing:-.018em;margin-bottom:3px}
.chverdict.orig .chvlb{color:var(--accent-ink)}
.chverdict.counter .chvlb{color:var(--sev-high)}
.chverdict.uncertain .chvlb{color:var(--sev-med)}
.chvwhy{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.chtest{
  margin-top:10px;display:flex;gap:10px;align-items:flex-start;padding:13px 15px;
  border-radius:var(--r-box);background:var(--accent-soft);font-size:14px;line-height:1.45;
}
.chtest .lb{font-size:14px;font-weight:700;color:var(--accent-ink);flex:0 0 auto}
.fbtn.chal{color:var(--sev-med);border-color:var(--sev-med)}
.fbtn.chal:hover{background:var(--sev-med-soft);color:var(--sev-med)}
.fbtn:disabled{opacity:.5;cursor:default}


.clarify.cannot{border-color:var(--sev-med);background:var(--sev-med-soft)}
.cantttl{flex:1;font-size:15px;font-weight:700;color:var(--sev-med);letter-spacing:-.018em}
.cantwhy{font-size:14.5px;line-height:1.5;color:var(--ink)}
.cantwhy2{font-size:13.5px;line-height:1.45;color:var(--ink-2)}

<script>
"use strict";
/* ============================================================
   SIGHTLINE
   A facade-industry market simulator.

   Design notes that matter:
   - Reveal is driven by a LOCAL TIMER, not by network arrival.
     Demo and live therefore feel identical, and a slow first
     chunk can never leave a dead skeleton on screen.
   - Confidence is COMPUTED here, never taken from the model.
     A model asked "how confident are you" reports a mood.
   - Numbers carry what they are a price OF. In this industry a
     system price and an installed price differ by ~3x, and a
     model will compare them without blinking.
   ============================================================ */

/* ---------- tiny helpers ---------- */
const NL = String.fromCharCode(10);
const QL = String.fromCharCode(8220), QR = String.fromCharCode(8221);
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const uid = () => { const a = new Uint32Array(2); (crypto.getRandomValues ? crypto : { getRandomValues: x => { for (let i=0;i<x.length;i++) x[i] = Math.floor(Math.random()*4294967296); } }).getRandomValues(a); return a[0].toString(36) + a[1].toString(36); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const words = (s, n) => { const w = String(s || "").trim().split(/\s+/); return w.length <= n ? String(s || "").trim() : w.slice(0, n).join(" ") + "…"; };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2100);
}

/* ============================================================
   MODES — filtered to what a physical, specification-led facade
   business actually decides. The generic-PM and war-gaming
   entries were deliberately dropped.
   ============================================================ */
/* ------------------------------------------------------------
   THE CLARIFY LAYER

   A vague question is the biggest single cause of a generic
   answer, so before running we check what the question is
   missing and ask for it.

   Detection and options are both LOCAL. No API call, no cost,
   no waiting. Options come from fixed lists and from the
   workspace roster, which is why filling the roster in makes
   this better too.

   The enriched sentence is written back into the input box
   in full view. Hiding it would waste the part that teaches
   the user what a good question contains.
   ------------------------------------------------------------ */
const has = re => (t) => re.test(t);
const opt = (label, phrase, excl) => ({ label, phrase: phrase || label, excl: !!excl });
const ROSTER_KEYS = ["rivals", "channel", "customers", "suppliers", "bodies"];
const namesIn = (ws, key) => (ws.ctx[key] || "").split(",").map(x => x.trim()).filter(Boolean);
const allNames = ws => ROSTER_KEYS.reduce((a, k) => a.concat(namesIn(ws, k)), [])
  .concat((ws.ctx.roster || "").split(",").map(x => x.trim()).filter(Boolean));

const SLOTS = {
  rival: {
    q: "Which competitor are we talking about?",
    multi: true,
    detect: (t, ws) => {
      const low = t.toLowerCase();
      // A roster entry is "Reynaers Aluminium" but people type "Reynaers", so match on
      // any distinctive word in the name rather than the whole string.
      const GENERIC = new Set(["aluminium","aluminum","glass","group","india","systems","system",
        "building","industries","limited","ltd","company","properties","estates","international","the"]);
      const names = allNames(ws);
      for (const n of names) {
        const parts = n.toLowerCase().replace(/[()]/g, " ").split(/\s+/).filter(w => w.length > 3 && !GENERIC.has(w));
        if (parts.some(w => low.includes(w))) return true;
      }
      return false;
    },
    options: (ws, text) => {
      /* Ranking, in strict order. Deterministic: the same question always produces
         the same list. Nothing here is random.
           1. Named in your question. If you typed "Reynaers", it comes first.
           2. Ones you have picked before, most picked first. The list learns.
           3. Named in a fact you have saved about this market.
           4. Everything else, sampled evenly across the list so the same few
              names do not always sit at the top.
         The honest limit: nothing records which of your rivals are Chinese, or which
         compete in the segment you mentioned, so relevance beyond a literal name
         match is not something this can know. Editing your Competitors list, and
         picking here, is what teaches it. */
      const t = (text || "").toLowerCase();
      const use = ws.rivalUse || {};
      const factText = ((ws.facts || []).map(f => f.text).join(" ")).toLowerCase();
      const all = namesIn(ws, "rivals").length ? namesIn(ws, "rivals") : allNames(ws);
      const words_ = n => n.toLowerCase().replace(/[()]/g, " ").split(/\s+/).filter(x => x.length > 3);
      const scored = all.map((n, i) => {
        const w = words_(n);
        return { n, i,
          named: w.some(x => t.includes(x)) ? 1 : 0,
          used: use[n] || 0,
          inFacts: w.some(x => factText.includes(x)) ? 1 : 0 };
      });
      const named = scored.filter(x => x.named).sort((p, q) => q.used - p.used);
      const known = scored.filter(x => !x.named && (x.used || x.inFacts))
                          .sort((p, q) => (q.used - p.used) || (q.inFacts - p.inFacts));
      const rest = scored.filter(x => !x.named && !x.used && !x.inFacts);
      const picked = named.slice(0, 3).concat(known).slice(0, 5).map(x => x.n);
      const want = Math.max(0, 5 - picked.length);
      const step = Math.max(1, Math.floor(rest.length / Math.max(1, want)));
      for (let i = 0; i < rest.length && picked.length < 5; i += step) picked.push(rest[i].n);
      const o = picked.map(n => opt(n, "Competitor in focus: " + n + "."));
      if (/china|chinese|import/i.test(t)) o.unshift(opt("Low cost imports", "Competitor in focus: low cost imported systems."));
      o.push(opt("Someone else", "", false));
      o.push(opt("Not one in particular", "No single competitor. Treat this as category wide pressure.", true));
      return o;
    }
  },
  horizon: {
    q: "Over what period should this play out?",
    detect: has(/\bweek|\bmonth|\bquarter|\byear|\bq[1-4]\b|\bdays?\b|immediat|short term|long term/i),
    options: () => [
      opt("Next few weeks", "Time frame: the next few weeks."),
      opt("One quarter", "Time frame: one quarter."),
      opt("Two quarters", "Time frame: two quarters."),
      opt("A year", "Time frame: about a year."),
      opt("Longer than a year", "Time frame: longer than a year.")
    ]
  },
  segment: {
    q: "Which part of the market?",
    multi: true,
    detect: has(/residential|commercial|institution|tender|retail|hospitality|villa|high.?rise|office|hotel|hospital|school/i),
    options: () => [
      opt("Premium residential", "Segment: premium residential."),
      opt("Mid market residential", "Segment: mid market residential."),
      opt("Commercial towers", "Segment: commercial towers."),
      opt("Institutional", "Segment: institutional buildings."),
      opt("Open government tenders", "Segment: open government tenders, awarded to lowest bidder."),
      opt("All of it", "Segment: the whole market, not one segment.", true)
    ]
  },
  direction: {
    q: "Which way is the price moving?",
    detect: has(/increas|rais|reduc|cut\b|drop|lower|hold|discount|launch at|price at|[₹$€]\s?\d|\d+\s?%/i),
    options: () => [
      opt("Putting it up", "We are increasing the price."),
      opt("Bringing it down", "We are reducing the price."),
      opt("Holding and defending", "We are holding price and defending it."),
      opt("Setting a launch price", "We are setting a price for a new launch."),
      opt("Changing discount policy", "We are changing discount policy rather than list price.")
    ]
  },
  priceBasis: {
    q: "Your price is a price of what?",
    detect: has(/per m|per square|per sq|installed|ex.?works|per opening|per project|per tonne|per kg/i),
    options: () => [
      opt("Ex works system, per square metre", "Our price is an ex works system price, per square metre."),
      opt("Installed window, per square metre", "Our price is a finished installed price, per square metre."),
      opt("Per opening", "Our price is quoted per opening."),
      opt("Per project", "Our price is quoted per project."),
      opt("Per kilogram of profile", "Our price is quoted per kilogram of profile.")
    ]
  },
  ourMove: {
    q: "What are you doing that they would react to?",
    detect: has(/launch|price|enter|win|bid|introduc|announc|expand|acquir|partner/i),
    options: () => [
      opt("A price change", "Our move: a price change."),
      opt("A new system launch", "Our move: launching a new system."),
      opt("Entering a new region", "Our move: entering a new region."),
      opt("Winning a marquee project", "Our move: winning a high visibility project."),
      opt("Nothing yet, they moved first", "They moved first. We are deciding how to respond.", true)
    ]
  },
  dealContext: {
    q: "Where does this actually come up?",
    detect: has(/tender|spec|boq|procure|account|deal|pitch|quote|bid|meeting/i),
    options: () => [
      opt("In a live tender", "Context: a live tender."),
      opt("At specification stage", "Context: specification stage, with the architect or consultant."),
      opt("At BOQ or procurement review", "Context: BOQ and procurement review, where value engineering happens."),
      opt("In a repeat account", "Context: an existing repeat account."),
      opt("On a first approach", "Context: a first approach to a new customer.")
    ]
  },
  input: {
    q: "Which input moved?",
    multi: true,
    detect: has(/alumin|glass|energy|power|freight|hardware|steel|coating|billet|lme|gasket|sealant/i),
    options: () => [
      opt("Aluminium", "Input affected: aluminium."),
      opt("Glass", "Input affected: glass."),
      opt("Energy", "Input affected: energy."),
      opt("Freight", "Input affected: freight and logistics."),
      opt("Hardware", "Input affected: hardware and accessories."),
      opt("Several together", "Several inputs moved at the same time.", true)
    ]
  },
  magnitude: {
    q: "How big is the move?",
    detect: has(/\d+\s?%|percent|doubl|halv|sharp|slight|marginal|\btimes\b/i),
    options: () => [
      opt("Under 10 percent", "Size of move: under 10 percent."),
      opt("Around 10 to 20 percent", "Size of move: roughly 10 to 20 percent."),
      opt("More than 20 percent", "Size of move: more than 20 percent."),
      opt("Not sure yet", "Size of move: not yet known.", true)
    ]
  },
  exposure: {
    q: "Where are you exposed to it?",
    multi: true,
    detect: has(/fixed price|contract|quotation|quoted|list price|escalation|clause/i),
    options: () => [
      opt("Fixed price contracts already signed", "Exposure: fixed price contracts already signed."),
      opt("Quotes out, not yet won", "Exposure: live quotations not yet converted."),
      opt("Standard list pricing", "Exposure: standard list pricing."),
      opt("Our fabricators carry it", "Exposure sits with our fabricators rather than with us.")
    ]
  },
  code: {
    q: "Which rule or standard?",

  channelType: {

   German specification and an Indian BOQ review as the same

const behaviourSet = ws => BEHAVIOUR.filter(b => (ws.behaviour || {})[b.id]).length;

function behaviourLines(ws) {
  const bh = ws.behaviour || {};

  BEHAVIOUR.forEach(b => {
    const picked = bh[b.id]; if (!picked) return;
    const o = b.opts.find(x => x[0] === picked);
    out.push("  " + b.q.replace(/\?$/, "") + ": " + picked + (o ? ". " + o[1] : ""));

const MODE_HINTS = [
  ["cost_shock",     /(alumin\w*|lme|billet|glass|energy|freight|input cost|raw material|commodity|surcharge)[\s\S]{0,40}(up\b|rise|rose|rising|jump\w*|spike|increas\w*|fell|fall\w*|drop\w*|shock|volatil\w*|\d+\s?%)|(price|cost)s?\s+of\s+(alumin\w*|glass|energy)/i],

/* ------------------------------------------------------------
   CAN THIS EVEN BE ANSWERED

   Sightline reasons about reaction and consequence. It has no web
   search, so a question asking what is currently the case cannot
   be answered, only guessed at. Guessing fluently is the single
   most damaging thing it could do, so those questions are caught
   before a call is made and the reason is stated plainly.

   A hypothetical marker always wins. "What if they announced a
   price cut" contains "announced" but is a perfectly good question.
   ------------------------------------------------------------ */
const HYPOTHETICAL = /\bwhat if\b|\bif we\b|\bif they\b|\bif a\b|\bif our\b|\bsuppose\b|\bimagine\b|\bassume\b|were to\b|would happen|\bshould we\b|\bhow would\b|\bwhat would\b|\bhow will\b|\bwhat happens\b|\bplan(ning)? to\b|\bthinking of\b|\bconsidering\b/i;

const FACT_ASKS = [
  { re:/market (share|size)|how (big|large) is|revenue of|turnover of|valuation of|how many (companies|players|units|projects)/i,
    why:"That asks for a market figure. Sightline never states market sizes or shares, because it cannot look one up and a fabricated figure is worse than no figure." },
  { re:/\b(latest|recent|recently|current|currently|right now|today|this (month|week|quarter|year)|last (month|week|quarter)|so far this year|up to date|as of)\b/i,
    why:"That asks for the current state of things. There is no web search here, so anything it told you would come from training data that may be a year or more out of date." },
  { re:/\b(announce\w*|launch(ed)?\s+(a|the|their)|acquir(ed|ing)\b|merged|in the news|headline|press release|what happened)\b/i,
    why:"That asks what has happened. Sightline cannot read the news. It reasons about what people will do, not about what they have already done." },
  { re:/what (is|are) (the |their )?(price|prices|cost|costs|rate|rates)\b|how much (does|do|is|are)\b|what do they charge/i,
    why:"That asks for a real price. The only figure treated as fact here is your own anchor. Everything else is expressed relative to it." },
  { re:/^who (is|are|has|have|owns)\b|^which compan(y|ies)\b|^where (is|are)\b|^when did\b|^how many\b/i,
    why:"That asks for a fact rather than a reaction. Sightline works out what people will do next, which is a different question." }
];

function answerability(text) {
  if (HYPOTHETICAL.test(text)) return null;
  for (const f of FACT_ASKS) if (f.re.test(text)) return f.why;
  return null;
}

/* An auto rewrite of a fact question reads badly, because the grammar rarely
   survives. Showing what a good question looks like for this mode teaches more
   and never produces a broken sentence. */
function reframeExamples(mode) {
  return (EXAMPLES[mode] || EXAMPLES.rival_response).slice(0, 2);
}

function findGaps(text, mode, ws) {
  const want = MODE_SLOTS[mode] || ["segment", "horizon"];
  const out = [];
  for (const id of want) {
    const sl = SLOTS[id];
    if (!sl) continue;
    let covered = false;
    try { covered = sl.detect(text, ws); } catch (e) { covered = false; }
    if (!covered) out.push({ id, slot: sl });
    if (out.length === 3) break;
  }
  return out;
}

/* Repair text that was saved while the page was being read as the wrong encoding.

   umlaut became Sch, capital A tilde, one quarter sign. Fixing the file does not
   fix text already written, so this walks the saved state once and puts it back.
   TextDecoder is set to fatal, so anything that is not genuinely double encoded
   throws and the original is kept untouched. */
function unmojibake(str) {
  if (typeof str !== "string" || !/[ÂÃ][-¿]/.test(str)) return str;
  try {
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      if (c > 255) return str;
      bytes[i] = c;
    }
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  } catch (e) { return str; }
}
function repairText(v) {
  if (typeof v === "string") return unmojibake(v);
  if (Array.isArray(v)) return v.map(repairText);
  if (v && typeof v === "object") { Object.keys(v).forEach(k => { v[k] = repairText(v[k]); }); return v; }
  return v;
}

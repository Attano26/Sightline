      const n = el("div", "notice");
      n.innerHTML = "<span>No signals tracked yet. Every risk in a card carries an early warning you can watch for. Tap <b>Track signals</b> on any card to bring them here, grouped under the simulation they came from.</span>";
      s.appendChild(n); return;
    }
    const n = el("div", "notice");
    n.innerHTML = "<span>These are dated, checkable predictions, each kept with the question that produced it. Marking what actually happened is the only way this tool ever learns whether it was right, and every answer is added to that workspace as a confirmed fact.</span>";
    s.appendChild(n);

    // Grouped by simulation. A flat list of warnings with no question attached
    // is unreadable after the second one.
    // Newest simulation first, but stages within a simulation stay in order.
    const groups = [];
    open.forEach(sig => {
      const key = sig.chatId || ("mode:" + sig.mode);
      let g = groups.find(x => x.key === key);
      if (!g) { g = { key, title: sig.chatTitle || modeById(sig.mode).name,
                      question: sig.question || "", mode: sig.mode,
                      wsName: sig.wsName || "", items: [] }; groups.push(g); }
      g.items.push(sig);
    });

    groups.reverse().forEach(g => {
      const box = el("div", "siggroup");
      const hd = el("div", "sighd");
      hd.appendChild(el("span", "sigmode", modeById(g.mode).name));
      if (g.wsName) hd.appendChild(el("span", "sigws", g.wsName));
      hd.appendChild(el("span", "sigcount", g.items.length + (g.items.length === 1 ? " signal" : " signals")));
      box.appendChild(hd);
      box.appendChild(el("div", "sigq", g.question ? QL + words(g.question, 22) + QR : g.title));

      g.items.forEach(sig => {
        const row = el("div", "sigitem" + (sig.severity === "HIGH" ? " high" : ""));
        const meta = el("div", "sigmeta");
        meta.appendChild(el("span", "sigstage", sig.stage || ""));
        meta.appendChild(el("span", "sigwhen", HZ[sig.horizon] || "soon"));
        row.appendChild(meta);
        row.appendChild(el("div", "sigtext", sig.text));
        if (sig.risk) row.appendChild(el("div", "sigrisk", "Would mean: " + sig.risk));
        const btns = el("div", "sigbtns");
        [["It happened", "hit"], ["It did not", "miss"], ["Too early", "open"]].forEach(([lb, st]) => {
          const bb = el("button", "sigbtn" + (st === "hit" ? " hit" : st === "miss" ? " miss" : ""), lb);
          bb.onclick = () => {
            if (st === "open") { toast("Left open"); return; }
            sig.state = st;
            const w = S.workspaces.find(x => x.id === sig.wsId);
            if (w) {
              w.facts = w.facts || [];
              const txt = (st === "hit" ? "Observed: " : "Did not happen: ") + sig.text +
                          ". Predicted when asking " + QL + words(sig.question || sig.headline, 16) + QR + ".";
              if (!w.facts.some(f => f.text === txt)) w.facts.push({ text:txt, at:Date.now() });
            }
            save(); renderSignalCount(); openSignals();
          };
          btns.appendChild(bb);
        });
        row.appendChild(btns);
        box.appendChild(row);
      });
      s.appendChild(box);
    });

    const done = S.signals.filter(x => x.state !== "open");
    if (done.length) {
      const d = el("details", "gaps"); d.style.borderTop = "1px solid var(--line-2)";
      const sm = el("summary");
      sm.appendChild(el("span", "tw", "›"));
      sm.appendChild(el("span", "", "Already resolved"));
      sm.appendChild(el("span", "cnt", String(done.length)));
      d.appendChild(sm);
      const gl = el("div", "gaplist");
      done.slice().reverse().forEach(x => {
        const g2 = el("div", "gap");
        g2.appendChild(el("div", "gu", x.text));
        g2.appendChild(el("div", "gh", x.state === "hit" ? "It happened" : "It did not happen"));
        gl.appendChild(g2);
      });
      d.appendChild(gl); s.appendChild(d);
    }
  });
}

/* ============================================================
   WIRING
   ============================================================ */
function syncMode() { /* the mode is inferred per question, so there is no permanent control */ }

function setSyncBadge(state) {
  const b = $("#btnSync"), d = $("#syncDot"), l = $("#syncLabel");
  if (!b) return;
  const g = S.gsync;
  if (!g || !g.clientId || !g.token) { b.hidden = true; return; }
  b.hidden = false;
  d.className = "syncdot " + state;
  l.textContent = state === "ok" ? "Synced" : state === "conflict" ? "Two copies differ" : state === "syncing" ? "Syncing" : "Sync problem";
  b.title = state === "ok" && g.lastSync ? "Last synced " + new Date(g.lastSync).toLocaleString() : "Open settings to sort this out";
}
function updateCtxPill() {
  const ws = activeWs(); const p = $("#ctxPill");
  if (!p) return;
  const missing = ctxMissing(ws);
  if (!missing.length) {
    p.textContent = ws.name;
    p.title = "Everything this simulator needs about you is filled in";
  } else if (missing.length >= 3) {
    p.textContent = "Set up " + ws.name;
    p.title = "Still missing: " + missing.join(", ");
  } else {
    p.textContent = ws.name + " · add " + missing[0];
    p.title = missing.length > 1 ? "Still missing: " + missing.join(", ") : "Add " + missing[0];
  }
  p.classList.toggle("warn", missing.length > 0);
}
function autosize() { const t = $("#ta"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 150) + "px"; }
function updateSend() {
  const v = $("#ta").value.trim();
  $("#send").disabled = busy || !v;
  // The type of simulation is inferred, so we show what it decided rather than
  // making the user set it first. It appears only once there is something to read.
  const row = $("#typeRow");
  if (!row) return;
  row.hidden = false;
  const guessed = S.forcedMode || (v ? inferMode(v) : null);
  const lb = row.querySelector(".typelb");
  if (!v) {
    lb.textContent = "Simulation";
    $("#typeVal").textContent = modeById(S.mode).name;
  } else if (guessed) {
    lb.textContent = S.forcedMode ? "Running as" : "Reading this as";
    $("#typeVal").textContent = modeById(guessed).name;
  } else {
    lb.textContent = "Simulation";
    $("#typeVal").textContent = "it will ask";
  }
  S.pendingMode = guessed || null;
}

/* ---------- the clarify panel ----------
   One question per screen, like a short interview. Answering three questions
   on one screen reads as a form and gets skipped; answering one at a time
   reads as a conversation and gets finished. Back, next, and skip are always
   available so it never traps anyone.
   --------------------------------------- */
let clarifyState = null;

function openCannot(text, why) {
  closeClarify();
  const c = $("#clarify"); c.hidden = false; c.innerHTML = "";
  c.classList.add("cannot");
  const head = el("div", "clhead");
  head.appendChild(el("span", "cantttl", "This is not a question Sightline can answer"));
  c.appendChild(head);
  c.appendChild(el("div", "cantwhy", why));
  c.appendChild(el("div", "cantwhy2", "It has no web search, by design. That is what keeps it free to run, and it is why it reasons about what people will do rather than reporting what is currently true."));

  const lb = el("div", "cantlb", "Questions like these do work");
  c.appendChild(lb);
  const exs = el("div", "clopts");
  reframeExamples(S.mode).forEach(q => {
    const b = el("button", "clopt", q);
    b.onclick = () => { $("#ta").value = q; autosize(); updateSend(); closeCannot(); $("#ta").focus(); };
    exs.appendChild(b);
  });
  c.appendChild(exs);

  const opts = el("div", "clopts");
  const ed = el("button", "clopt", "Let me rewrite mine");
  ed.onclick = () => { closeCannot(); $("#ta").focus(); };
  opts.appendChild(ed);
  const any = el("button", "clopt", "Ask it anyway");
  any.onclick = () => { S.overrideAnswerability = true; closeCannot(); submit(); };
  opts.appendChild(any);
  c.appendChild(opts);

  const warn = el("div", "cantalt");
  warn.appendChild(el("span", "lb", "If you ask anyway"));
  warn.appendChild(el("span", "", "It will answer from training data with no way to check it, and the confidence score will not know that the answer was unanswerable. Treat anything factual in it as unverified."));
  c.appendChild(warn);
  scrollDown();
}
function closeCannot() {
  const c = $("#clarify"); c.hidden = true; c.innerHTML = ""; c.classList.remove("cannot");
}

function closeClarify() {
  clarifyState = null;
  const c = $("#clarify"); c.hidden = true; c.innerHTML = ""; c.classList.remove("cannot");
}

function openClarify(text, mode, gaps, askMode) {
  clarifyState = { base: text, mode, gaps, idx: 0, picked: {}, custom: {}, askMode: !!askMode };
  $("#clarify").hidden = false;
  paintClarify();
  scrollDown();
}

function clarifySteps() {
  const st = clarifyState;
  const steps = st.gaps.map(g => ({ kind: "slot", g }));
  if (st.askMode) steps.unshift({ kind: "mode" });
  return steps;
}

function paintClarify() {
  const st = clarifyState; if (!st) return;
  const ws = activeWs();
  const c = $("#clarify"); c.innerHTML = "";
  const steps = clarifySteps();
  const step = steps[st.idx];
  const total = steps.length;

  const head = el("div", "clhead");
  head.appendChild(el("span", "clstep", "Question " + (st.idx + 1) + " of " + total));
  const skip = el("button", "clskip", "Skip and run anyway");
  skip.onclick = () => { const t = st.base, m = st.mode; closeClarify(); doRun(t, m); };
  head.appendChild(skip);
  c.appendChild(head);

  const blk = el("div", "clq");
  const row = el("div", "clopts");

  if (step.kind === "mode") {
    blk.appendChild(el("div", "clqt", "What are you testing?"));
    MODES.forEach(m => {
      const b = el("button", "clopt" + (st.mode === m.id ? " on" : ""), m.name);
      b.onclick = () => { st.mode = m.id; st.gaps = findGaps(st.base, m.id, ws); next(); };
      row.appendChild(b);
    });
  } else {
    const g = step.g;
    const qh = el("div", "clqt");
    qh.appendChild(el("span", "", g.slot.q));
    if (g.slot.multi) qh.appendChild(el("span", "clmulti", "pick any number"));
    if (g.id === "rival") qh.appendChild(el("span", "clsrc", "from your saved list"));
    blk.appendChild(qh);

    let opts = [];
    try { opts = g.slot.options(ws, st.base) || []; } catch (e) { opts = []; }
    const cur = () => st.picked[g.id] || (st.picked[g.id] = []);

    opts.forEach(o => {
      const isCustom = o.label === "Someone else";
      const b = el("button", "clopt", o.label);
      if (cur().some(x => x.label === o.label)) b.classList.add("on");
      b.onclick = () => {
        const list = cur();
        const i = list.findIndex(x => x.label === o.label);
        if (i >= 0) {
          list.splice(i, 1); b.classList.remove("on");
          if (isCustom) { const f = c.querySelector(".clfree"); if (f) f.remove(); }
        } else {
          // exclusive options clear everything, and any other option clears them
          if (!g.slot.multi || o.excl) { list.length = 0; row.querySelectorAll(".clopt").forEach(x => x.classList.remove("on")); const f = c.querySelector(".clfree"); if (f) f.remove(); }
          else { opts.filter(x => x.excl).forEach(x => {
                   const j = list.findIndex(y => y.label === x.label);
                   if (j >= 0) { list.splice(j, 1); [...row.children].forEach(el2 => { if (el2.textContent === x.label) el2.classList.remove("on"); }); }
                 }); }
          list.push(o); b.classList.add("on");
          if (g.id === "rival" && !isCustom && o.label !== "Not one in particular") {
            const ws2 = activeWs();
            ws2.rivalUse = ws2.rivalUse || {};
            ws2.rivalUse[o.label] = (ws2.rivalUse[o.label] || 0) + 1;
            save();
          }
          if (isCustom) showFree(g);
        }
        paintFoot();
      };
      row.appendChild(b);
    });
  }
  blk.appendChild(row);
  c.appendChild(blk);

  const foot = el("div", "clfoot"); foot.id = "clFoot";
  c.appendChild(foot);
  paintFoot();

  function showFree(g) {
    if (c.querySelector(".clfree")) return;
    const f = el("div", "clfree");
    const inp = el("input");
    inp.placeholder = "Type the name";
    inp.oninput = () => { st.custom[g.id] = inp.value.trim(); paintFoot(); };
    if (st.custom[g.id]) inp.value = st.custom[g.id];
    f.appendChild(inp);
    blk.appendChild(f);
    inp.focus();
  }

  function next() {
    if (st.idx < clarifySteps().length - 1) { st.idx++; paintClarify(); }
    else { const t = buildClarified(), m = st.mode; closeClarify(); doRun(t, m); }
  }

  function paintFoot() {
    const f = $("#clFoot"); if (!f) return;
    f.innerHTML = "";
    if (st.idx > 0) {
      const back = el("button", "clback", "Back");
      back.onclick = () => { st.idx--; paintClarify(); };
      f.appendChild(back);
    }
    const n = Object.keys(st.picked).reduce((a, k) => a + (st.picked[k] || []).length, 0);
    const prev = el("div", "clprev", n ? n + (n === 1 ? " detail added" : " details added") : "Nothing selected yet");
    if (n) prev.classList.add("has");
    f.appendChild(prev);
    const last = st.idx >= clarifySteps().length - 1;
    const go = el("button", "clgo", last ? "Run simulation" : "Next");
    go.onclick = next;
    f.appendChild(go);
    const ta = $("#ta"); ta.value = buildClarified(); autosize();
  }
}

function buildClarified() {
  const st = clarifyState; if (!st) return "";
  const extra = [];
  Object.keys(st.picked).forEach(k => {
    (st.picked[k] || []).forEach(o => {
      if (o.label === "Someone else") {
        const v = (st.custom[k] || "").trim();
        if (v) extra.push(k === "rival" ? "Competitor in focus: " + v + "." : v + ".");
      } else if (o.phrase) extra.push(o.phrase);
    });
  });
  return extra.length ? st.base.replace(/\s*$/, "") + "\n\n" + extra.join(" ") : st.base;
}

/* Every send goes through here. If the question is missing something the
   chosen mode needs, ask before spending a call on a vague answer. Once
   asked for a given question we do not ask again, so a user who skips is
   never nagged. */
function submit() {
  const v = $("#ta").value.trim();
  if (!v || busy) return;
  if (clarifyState) { const t = buildClarified(), m = clarifyState.mode; closeClarify(); doRun(t, m); return; }
  // A referential message about the card already on screen is a conversation,
  // not a new simulation. It skips the clarify and answerability gates, because
  // neither applies to "why do you say that".
  const chat = activeChat();
  if (looksLikeFollowUp(v, chat)) { $("#ta").value = ""; autosize(); updateSend(); runFollowUp(v, chat); return; }
  // Answerability is checked before anything else, because running a call on a
  // question that cannot be answered produces a fluent, confident, invented reply.
  if (!S.overrideAnswerability) {
    const why = answerability(v);
    if (why) { openCannot(v, why); return; }
  }
  S.overrideAnswerability = false;
  const guessed = S.forcedMode || inferMode(v);
  const mode = guessed || S.mode;
  const gaps = findGaps(v, mode, activeWs());
  // Ask what kind of question this is only when we genuinely could not tell.
  if (!guessed || gaps.length) { openClarify(v, mode, gaps, !guessed); return; }
  doRun(v, mode);
}

async function runFollowUp(text, chat) {
  if (busy) return;
  const ws = activeWs();
  const last = [...chat.turns].reverse().find(t => t.role === "card");
  if (!last) return;
  chat.turns.push({ role:"user", text, mode:last.mode, followUp:true });
  chat.updated = Date.now(); save();

  const box = $("#streamIn");
  const uw = el("div", "uturn"); const ub = el("div", "ubub");
  ub.appendChild(el("span", "", text));
  uw.appendChild(ub); box.appendChild(uw);

  const host = el("div"); box.appendChild(host);
  const pend = el("div", "replybox pending");
  pend.appendChild(el("span", "dot"));
  pend.appendChild(el("span", "", "Thinking about that"));
  host.appendChild(pend);
  busy = true; updateSend(); scrollDown();

  let out = null, err = null;
  try {
    if (!S.key) { await sleep(600); out = demoFollowUp(text); }
    else out = await callGemini(S.key, followUpPrompt(last.data, last.mode, ws), text, FOLLOWUP_SCHEMA);
  } catch (e) { err = e; }
  busy = false; updateSend();
  pend.remove();

  if (err) {
    const e2 = el("div", "err");
    e2.innerHTML = "<b>That did not go through.</b> " + esc(err.message || "");
    host.appendChild(e2);
    chat.turns.push({ role:"error", title:"That did not go through.", body:" " + (err.message || "") });
  } else {
    chat.turns.push({ role:"reply", data:out });
    renderReply(host, out);
  }
  chat.updated = Date.now(); save(); renderRail(); scrollDown();
}

function renderReply(host, out) {
  const BASIS = { FROM_THE_CARD:["card","From the answer above"],
                  FROM_YOUR_CONTEXT:["ctx","From what you told it"],
                  MY_GENERAL_KNOWLEDGE:["gen","Its own general knowledge, nothing to check it against"],
                  I_DO_NOT_KNOW:["none","It does not know"] };
  const b = BASIS[out.basis] || BASIS.MY_GENERAL_KNOWLEDGE;
  const box = el("div", "replybox fadein");
  box.appendChild(el("div", "replytxt", out.answer));
  const foot = el("div", "replyfoot");
  foot.appendChild(el("span", "rbasis " + b[0], b[1]));
  if (out.changes_the_read && !/^no change/i.test(out.changes_the_read.trim())) {
    const c = el("span", "rchange", "Changes the read: " + out.changes_the_read);
    foot.appendChild(c);
  }
  box.appendChild(foot);
  host.appendChild(box);
}

function doRun(text, mode) {
  $("#ta").value = ""; autosize(); updateSend();
  run(text, mode);
}

/* ------------------------------------------------------------
   UPDATES

   There is one copy of this app, on the host. Change it and every
   installed copy sees the change. The only wrinkle is that an
   installed copy keeps a local version so it opens offline, so it
   has to be told when a newer one exists.

   It is never swapped silently. The new version downloads in the
   background, a bar appears, and the swap happens when the person
   taps it. Nobody should have the interface change under them
   halfway through reading an answer.
   ------------------------------------------------------------ */
function showUpdateBar(reg) {
  const bar = $("#updateBar");
  if (!bar || !bar.hidden) return;
  bar.hidden = false; bar.innerHTML = "";
  const t = el("div", "ubtxt");
  t.innerHTML = "<b>A new version is ready.</b> Your workspaces, facts and history are untouched by this.";
  bar.appendChild(t);
  const go = el("button", "ubbtn", "Reload now");
  go.onclick = () => {
    if (reg.waiting) reg.waiting.postMessage("applyUpdate");
    setTimeout(() => location.reload(), 120);
  };
  bar.appendChild(go);
  const later = el("button", "ubbtn ghost", "Not now");
  later.onclick = () => { bar.hidden = true; };
  bar.appendChild(later);
}

function watchForUpdates() {
  // A file opened straight from disk, and a sandboxed preview, cannot register a
  // worker. That is expected, not an error, so it fails quietly.
  if (!("serviceWorker" in navigator) || location.protocol === "file:" || location.protocol === "data:") return;
  navigator.serviceWorker.register("./sw.js").then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg);
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        // controller present means this is a replacement, not a first install.
        if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdateBar(reg);
      });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) reg.update().catch(() => {});
    });
  }).catch(() => {});

  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded) return; reloaded = true; location.reload();
  });
}

const openRail = () => { $("#rail").classList.add("open"); $("#backdrop").classList.add("on"); };
const closeRail = () => { $("#rail").classList.remove("open"); $("#backdrop").classList.remove("on"); };

function boot() {
  load();
  if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  probeStorage(); showStorageBanner(); watchForUpdates();
  syncMode(); renderRail(); renderStream(); updateSend();

  $("#ta").addEventListener("input", () => { autosize(); updateSend(); });
  $("#ta").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });
  $("#send").onclick = () => submit();
  $("#newChat").onclick = () => { S.activeChat = null; save(); renderRail(); renderStream(); closeRail(); $("#ta").focus(); };
  $("#btnNewWs").onclick = () => {
    const w = { id:uid(), name:"New workspace", collapsed:false,
      ctx:{ company:"", product:"", market:"", audience:"", anchor:"", rivals:"", channel:"", customers:"", suppliers:"", bodies:"", horizon:"2 quarters" }, facts:[] };
    S.workspaces.push(w); S.activeWs = w.id; S.activeChat = null;
    save(); renderRail(); renderStream(); openWorkspace(w.id);
  };
  $("#btnSettings").onclick = openSettings;
  $("#btnSync").onclick = openSettings;
  if (S.gsync && S.gsync.clientId && S.gsync.token) setSyncBadge("ok");
  $("#btnSignals").onclick = openSignals;
  $("#ctxPill").onclick = () => openWorkspace(activeWs().id);
  $("#typeRow").onclick = () => openModes(id => {
    S.forcedMode = id; S.mode = id; save();
    $("#typeVal").textContent = modeById(id).name;
    $("#typeRow").hidden = false;
  });
  $("#ta").addEventListener("input", () => { S.forcedMode = null; });
  $("#hamb").onclick = openRail;
  $("#backdrop").onclick = closeRail;
  $("#scrim").onclick = e => { if (e.target === $("#scrim")) closeSheet(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closeRail(); } });
  $("#btnTheme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    S.theme = next; save();
  };
}
boot();
